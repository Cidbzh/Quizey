*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font:400 16.5px/1.6 var(--f-body);
  background:
    radial-gradient(1200px 460px at 50% -160px,var(--glow),transparent 72%),
    var(--bg);
  background-attachment:fixed;
}
::selection{background:var(--accent-soft)}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:10px}
.space-between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.grow{flex:1}
.topbar .divider{width:1px;height:20px;background:var(--line);flex:none}
@media (max-width:720px){.topbar .wrap{flex-wrap:wrap;row-gap:10px}}
/* barIn en fill `backwards`, JAMAIS `both`/`forwards` (2026-08-25, Cid) :
   avec `forwards`, le keyframe final `transform:none` continuerait à primer sur
   TOUTES les règles normales — quelle que soit leur spécificité (les animations
   priment sur le CSS normal) — et écraserait le transform `.topbar-off` : la
   topbar qui glisse hors de vue au scroll (téléphone) resterait figée.
   `backwards` garde le même fondu d'arrivée (état `from` pendant le délai) et,
   l'animation finie, la barre revient à son état naturel = le keyframe `to`. */
.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--surface);border-bottom:1px solid var(--line);
  animation:barIn .6s var(--ease) backwards;animation-delay:.05s;
}
.topbar{
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
}
@keyframes barIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.topbar .wrap{padding-top:12px;padding-bottom:12px}
/* Écrans larges : l'accueil est en 2 colonnes (marge 320 px + gap 16 px). Les
   sélecteurs (matière + thème) ne doivent plus « flotter » au-dessus de la
   colonne de la marge — où vivent les « Points faibles » : leur bord droit
   s'arrête au bord droit de la colonne principale (336 px = 320 + 16). Hors
   accueil (écran d'exercice, pleine largeur), la topbar reprend toute sa
   largeur. */
@media (min-width:1025px){
  body:has(#home:not([hidden])) .topbar .wrap{padding-right:336px}
  /* Marge vide (première visite, « Points faibles » absent) → colonne
     pleine largeur : les sélecteurs reprennent le bord droit réel de la
     page (20 px = padding horizontal de .wrap). Mêmes règles que le repli
     #home ci-dessous — 2026-08-24, Cid. */
  body:has(#home:not([hidden]):has(#statsExtra:empty)) .topbar .wrap{padding-right:20px}
}
.brand{display:inline-flex;align-items:center;font:700 21px var(--f-display);letter-spacing:.01em}
/* Pas de gap sur le conteneur : « Quiz » et « ey » seraient deux items flex
   séparés de 9 px. L'espacement logo→texte vit sur la marque elle-même. */
.brand .brandmark{flex:none;transform:translateY(1px);margin-right:9px}
.brand span{font-style:italic;color:var(--pen)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font:500 13.5px var(--f-mono);color:var(--muted);
  background:var(--accent-soft);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:600}

   BARRE de progression vers le palier suivant — même code couleur que la carte
   du hero (--accent). Track en --surface : la puce est en --accent-soft, le

.chip .nlvlbar{display:inline-block;vertical-align:middle;width:52px;height:6px;margin-left:8px;border-radius:999px;background:var(--surface);overflow:hidden}

   le hero commence directement par « Quizey » — la marge haute (36 px) qui
   faisait l'ancienne .eyebrow revient ici. */

}

}
.slogan .sai{position:relative;display:inline-block;color:var(--accent)}
/* Trait de plume sous « tu sais. » — l'app écrit la page, comme le prof gribouille en marge */
.slogan .sai .pen{position:absolute;left:2%;bottom:-8px;width:96%;height:10px;overflow:visible;pointer-events:none}
.slogan .sai .pen path{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;opacity:.85}
/* Le trait se trace (pathLength="1") dans la cascade html.boot → il se

@media (prefers-reduced-motion: no-preference){
  html.boot .slogan .sai .pen path{stroke-dasharray:1;stroke-dashoffset:1;animation:penIn .55s var(--ease) forwards;animation-delay:calc(1.15s*var(--boot-k,1))}
}
@keyframes penIn{to{stroke-dashoffset:0}}
/* Révélation mot à mot (masque de ligne) — titre, puis slogan ; le dernier
   mot « saute » sans masque, sinon le trait de plume serait rogné.
   Même principe que [data-rv] : VISIBLES par défaut (sécurité JS éteint),
   l'animation est posée sous html.boot → rearmBoot() rejoue tout à chaque
   bascule de matière (la bascule masque le changement de contenu). */
h1 .wr,.slogan .wr{display:inline-block;overflow:hidden;vertical-align:bottom}
h1 .wr>span,.slogan .wr>span{display:inline-block}
html.boot h1 .wr>span,html.boot .slogan .wr>span{transform:translateY(108%);animation:wrIn .9s var(--ease) both;animation-delay:calc(var(--d,0s)*var(--boot-k,1))}
@keyframes wrIn{to{transform:none}}
.slogan .soft{display:inline-block}
html.boot .slogan .soft{opacity:0;animation:saiIn .5s var(--ease) both;animation-delay:calc(var(--d,0s)*var(--boot-k,1))}
@keyframes saiIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

   coup ; sur mobile elle retombe naturellement sur plusieurs lignes (jamais d'overflow).
   Phrase encadrée de guillemets typographiques “ ” (2026-08-22, sur demande —

.lede{margin:0;color:var(--muted);font-size:17.5px;word-spacing:.12em}

   petite ; seule la sélection passe à l'accent — même langage que les
   boutons .seg-btn.on (fond surface + accent + ombre). Visible UNIQUEMENT
   maths × Terminale : en Seconde/Première et en PC/DE/EN elle est
   totalement absente (hidden — 2026-08-24, 2ᵉ passe Cid : plus d'espace
   réservé, l'écart « niveaux → chapitres » est le même qu'ailleurs). */
.xopt{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  font:500 13px/1.35 var(--f-body);color:var(--muted);
  background:var(--accent-soft);border:1px solid var(--line);border-radius:9px;padding:5px 10px;
  transition:border-color .16s var(--ease),color .16s var(--ease),background .16s var(--ease)}
.xopt:hover{border-color:var(--accent)}
.xopt.on{color:var(--accent);border-color:var(--accent);background:var(--surface);box-shadow:0 1px 2px rgba(31,46,71,.14)}
.xopt input{accent-color:var(--accent);width:14px;height:14px;flex:none;margin:0;cursor:pointer}
.xopt[hidden]{display:none}
/* (2026-08-24, Cid, 2 passe) : en maths, l'écart visible « niveaux →
   chapitres » contenait la ligne expertes + 2 gaps de 8 px + la marge de tête
   de 24 px ≈ 58 px, contre ~24 px en PC/DE/EN — jugé trop grand. En
   SECONDE/PREMIÈRE la ligne est maintenant ABSENTE (syncXopt pose hidden) →
   l'écart y est déjà le même qu'ailleurs (~24 px). Le resserrement
   (gaps 8→6 px, marge 24→16 px ≈ 52 px) ne s'applique donc plus qu'en
   TERMINALE, seule année où la ligne est visible — scopé via :has() sur le
   bouton d'année actif. Vieil navigateur sans :has → règles ignorées → écart
   par défaut (la ligne reste masquée par le JS, donc pas de régression). */
:root:not([data-mat]):has(#yearRow [data-year="terminale"].on) .picks{gap:6px}
:root:not([data-mat]):has(#yearRow [data-year="terminale"].on) .lead-head{margin-bottom:16px}
/* (2026-08-24, Cid) Checkbox « Maths expertes » EN MODE SOMBRE : fini le
   carré natif blanc (et l'état coché #60A5FA, quasi-blanc sur le fond nuit)
   — la case est dessinée, en bleu de marque #2563EB (lisible sur le bleu
   nuit #16213A) avec coche blanche ; non-cochée : fond doux bleu + bordure
   sombre. Thème clair inchangé (case native + accent-color). Deux scopes
   sombres (auto + « Sombre » explicite) = même gabarit que les variables
   couleurs du haut du fichier. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .xopt input{
    -webkit-appearance:none;appearance:none;
    background:rgba(96,165,250,.14);border:1.5px solid #2C3B5C;border-radius:4px;
    display:inline-grid;place-content:center;
  }
  :root:not([data-theme="light"]) .xopt input:checked{background:#2563EB;border-color:#2563EB}
  :root:not([data-theme="light"]) .xopt input:checked::after{
    content:"";width:7px;height:3px;margin-top:1px;
    border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);
  }
}
:root[data-theme="dark"] .xopt input{
  -webkit-appearance:none;appearance:none;
  background:rgba(96,165,250,.14);border:1.5px solid #2C3B5C;border-radius:4px;
  display:inline-grid;place-content:center;
}
:root[data-theme="dark"] .xopt input:checked{background:#2563EB;border-color:#2563EB}
:root[data-theme="dark"] .xopt input:checked::after{
  content:"";width:7px;height:3px;margin-top:1px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);
}
.lead-head ~ .subgrid{margin-top:0}
.seg-year .seg-btn{transition:color .25s var(--ease),background .25s var(--ease)}
@media (prefers-reduced-motion: no-preference){
  .seg-year .seg-btn:active{transform:scale(.95)}
  .seg-year .seg-btn.yearpick{animation:lvlPop .32s var(--ease)}
}
.theme-seg{display:inline-flex;background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.theme-btn{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font:600 13px var(--f-body);color:var(--muted);border-radius:999px;padding:4px 12px;
  transition:color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
}
.theme-btn.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(31,46,71,.14)}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin:8px 0 16px}
.subcard{
  appearance:none;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px;display:flex;flex-direction:column;gap:7px;
  transition:border-color .16s var(--ease),transform .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
}
.subcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.subcard.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
/* Nom de chapitre : police display grasse pour qu'il se lise comme un vrai titre.
   Couleur = accent de la matière (bleu maths / violet PC) : le quasi-noir (--ink)
   était jugé difficilement lisible (2026-08-19). */
.subcard .nm{font:700 16px/1.3 var(--f-display);color:var(--accent)}
.subcard .pc{font:500 12.5px var(--f-mono);color:var(--muted)}
/* Badge de portée (ex. « Terminale · hors bac 1re ») — posé par s.tag dans le registre */
.subcard .subtag{
  align-self:flex-start;
  font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap;
}
.btn{
  appearance:none;border:1px solid transparent;border-radius:10px;
  padding:11px 20px;font:600 15.5px var(--f-body);cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),filter .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease);
}
.btn:active{transform:translateY(1px)}
.btn.small{padding:7px 12px;font-size:14px}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.14)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -12px var(--accent),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(0,0,0,.14)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
/* Stats = 2e bloc de la rangée du hero (ordre 2026-08-22 : Niveau → Stats →
   À réviser) : le gap 16 px de .hero tient le rythme avec les deux cartes,
   et la largeur = colonne principale (même règle calc(100% - 336 px) qu'elles,
   pour que les quatre blocs aient exactement les mêmes bords). */
.hero .statgrid{width:calc(100% - 336px)}
.stat{border:1px solid var(--line);border-radius:10px;padding:15px 16px;background:var(--surface);transition:border-color .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease)}
.stat:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .v{font:600 24px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .k{font:500 12.5px var(--f-body);color:var(--muted);margin-top:2px}
/* v2 : points faibles / par thème / à réviser */
/* Deux lignes par point faible : (nom + %) puis (barre + bouton). La ligne
   unique cramait nom+barre(96px)+%(46px)+bouton dans la marge de 320 px,
   restant ~27 px pour le NOM : un mot sans espace (« Trigonométrie ») ne
   casse pas et déborderait par-dessus la barre. En deux lignes, le nom a la
   pleine largeur → le chevauchement est géométriquement impossible. */
.weakrow{display:grid;gap:7px;padding:11px 0;border-top:1px solid var(--line)}
.weakrow:first-of-type{border-top:0}
.weakline{display:flex;align-items:center;gap:10px;min-width:0}
.weaknm{font:600 15.5px var(--f-body);color:var(--accent);flex:1;min-width:0;overflow-wrap:break-word}
.weaknm small{display:block;font:500 12.5px var(--f-body);color:var(--muted)}
.weakbar{flex:1;min-width:0;height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.weakbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.weakpct{font:700 15px var(--f-mono);text-align:right;flex:none}
.substathead,.substatrow{display:grid;grid-template-columns:1fr 3.5rem 4.6rem 3.9rem;align-items:center;gap:8px;padding:9px 2px}
.substathead{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.substatrow{border-top:1px solid var(--line);font:500 15px var(--f-body);color:var(--muted)}
.substatrow b{font:700 15.5px var(--f-display);color:var(--accent)}
/* « À réviser » — PANNEAU STANDARD, comme les autres blocs de l'accueil
   (redesign 2026-08-21 : la carte « encre » était jugée plus voyante que le
   reste — l'applatir). Fond/bordure/ombre hérités de .panel, h2 standard avec
   son trait. Contenu = UNE LIGNE de cellules : [N dues aujourd'hui] |
   [≈ N min] | [chapitres] | [bouton]. Le compteur est en TEXTE SIMPLE, à
   l'identique des cellules « ≈ N min » et « chapitres » (unifié 2026-08-22
   sur demande — plus de compteur en gras 30 px). */
.revnum{font:500 14px/1.3 var(--f-body);color:var(--muted);white-space:nowrap;flex:none}
/* Bouton = .btn .btn-primary STANDARD, comme « Commencer l'entraînement »
   (pas de surcharge de taille pour ce bloc). */
/* ---------- « cahier avec marge » : accueil en 2 colonnes (spec §3.2) ---------- */
/* La rangée du hero traverse les DEUX colonnes : le bloc texte (titre +
   slogan + description) est en tête, et la carte « À réviser » passe SOUS
   le texte, sur sa propre ligne, avec la MÊME LARGEUR que la colonne
   principale : ses DEUX bords sont calés sur les blocs en dessous (stats /
   entraînement) — ne les dépasse jamais. Largeur = 100% de la
   rangée moins 336px (320 marge + 16 gap), le même décalage que les
   sélecteurs de la topbar. Écart description↔carte = 24 px : le rythme
   standard entre blocs (16 px) « légèrement augmenté » — demande 2026-08-21. */
/* row-gap 16 px = rythme standard entre panneaux (marge des .panel) —
   l'écart « À réviser » → blocs en dessous est le même que partout
   (demande 2026-08-21) ; column-gap 16 px AUSSI (demande 2026-08-21, 2e
   passe) : l'écart entre la colonne « Points faibles » et les blocs de la
   colonne principale = le même 16 px que partout → rythme unique. */
#home{display:grid;grid-template-areas:"hero hero" "main marge";grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.hero{grid-area:hero;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.herotxt{min-width:0}
/* « À réviser » : #revSlot est un simple <div> rempli/vidé par renderHome ;
   vide = display:none → pas de vide parasite. .revcta = panneau STANDARD
   (carton/bordure/ombre, pas plus voyant que les autres blocs), sur UNE
   ligne en « cellules plume » (demande 2026-08-22) : [titre] | [N
   questions] | [≈ N min] | [chapitres] | [bouton], un TRAIT DE PLUME
   VERTICAL entre chaque partie — le jumeau vertical du trait sous les
   titres (.panel h2::after), plus fin et plus doux.
   La carte reste sur sa propre ligne sous le texte du hero, pleine largeur
   de la colonne principale — alignée avec les blocs en dessous, sans jamais
   les dépasser ; son écart avec les blocs sous elle = 16 px, le rythme
   standard entre panneaux (row-gap de #home, même valeur que la marge des
   .panel). */
#revSlot{min-width:0;width:calc(100% - 336px)}
#revSlot:empty{display:none}
.hero .revcta{display:flex;align-items:center;flex-wrap:nowrap;gap:8px 10px;padding:17px 22px;margin-bottom:0;justify-content:space-between}
/* 2026-08-22 (sur demande) : titre aligné sur les titres de panneaux
   (`.panel h2`, « Entraînement libre ») — même taille 20 px / même design ;
   margin:0 conservé car la carte est en ligne (flex), le 16 px de .panel h2
   n'y a pas de sens. */
.hero .revcta h2{margin:0;font-size:20px;flex:none}
/* Cellules « plume » (2026-08-22) + contenu AGRANDI (demande 2026-08-21) :
   le bloc ne change PAS de dimensions — la taille gagnée (titre, compteur,
   chip, chapitres, bouton) est compensée par le gap et le padding vertical
   ramené à 17 px (hauteur totale inchangée). Les barres .revsep ne
   s'affichent qu'à ≥1280 px — sous cette largeur une barre risquerait de
   rester orpheline en bout de ligne repliée → masquée.
   Espacement (2026-08-21, 2e passe) : l'espace entre TOUTES les parties
   (y compris avant le bouton) est toujours ÉGAL —
   justify-content:space-between répartit l'espace libre à parts égales (le
   gap 10 px n'est plus qu'un plancher minimum). Les parties fixes sont
   flex:none ; SEUL .revchaps est rétrécissable (overflow:ellipsis) : quand
   la fenêtre est étroite (bande 1025-1200 px), les chapitres rétrécissent
   avec « … » au lieu de repousser le bouton → le bouton ne passe JAMAIS sur
   une 2e ligne. IMPORTANT : flex-wrap:nowrap (pas « wrap » !) — avec wrap,
   flexbox casse la ligne AVANT de rétrécir, le bouton tombe en 2e ligne et
   .revchaps ne rétrécit jamais. Bouton au bord droit (dernier élément).
   Vérifié .shots (1440 / 1280 / 1100). */
.hero .revcta .revsep{display:none}
@media (min-width:1280px){
  .hero .revcta .revsep{display:inline-block;flex:none;width:2px;height:32px;border-radius:2px;background:var(--accent);opacity:.45}
}
/* Carte de NIVEAU (hero, spec §3.3) : même langage « standard » que .revcta
   (carton/bordure/ombre via les variables du .panel), largeur = colonne
   principale — même règle que « À réviser » : calc(100% - 336px) ≥1025 px,
   100 % sous 1025 px. Le texte « x / y XP » porte l'information ; la barre
   est décorative (aria-hidden). Premier bloc de la rangée du hero après le
   texte (ordre 2026-08-22 : Niveau → Stats → À réviser). UNE CARTE PAR
   MATIÈRE (clés qz_xp / qz_xp_pc / qz_xp_de / qz_xp_en) — jamais la XP
   d'une autre matière. Re-rendue à chaque renderHome() et à chaque gainXp(). */
#lvlSlot{width:100%}
.lvcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 22px}
.lvcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lvcard-nm{font:600 18px var(--f-body);color:var(--ink)}
.lvcard-xp{font:500 14px var(--f-body);color:var(--muted);white-space:nowrap}
.lvbar{height:8px;border-radius:999px;background:var(--accent-soft);margin-top:10px;overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
@media(min-width:1025px){#lvlSlot{width:calc(100% - 336px)}}
@media (prefers-reduced-motion: no-preference){.lvbar i{transition:width .3s var(--ease)}}
/* « ≈ N min » = TEXTE SIMPLE, identique visuellement aux chapitres (unifié
   2026-08-21) — plus de pastille : même typo 500 14 px/1.3 / --muted ;
   largeur fixe (flex:none) : SEUL .revchaps peut se rétrécir. */
.hero .revcta .revtime{font:500 14px/1.3 var(--f-body);color:var(--muted);white-space:nowrap;flex:none}
.hero .revcta .revchaps{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 14px/1.3 var(--f-body);color:var(--muted)}
/* Bouton de la carte élargi SEUL — surcharge scopée .hero .revcta, le
   .btn global (15,5 px) reste intact partout ailleurs. */
.hero .revcta .btn{padding:13px 22px;font-size:17px;flex:none}
.home-main{grid-area:main;min-width:0}
.marge{grid-area:marge;min-width:0}
.margewrap{position:sticky;top:88px;display:grid;gap:24px}
/* Remontée (2026-08-22, sur demande) : « Tes points faibles » s'aligne sur le
   HAUT de la carte « Niveau » de la rangée du hero — margin-top NÉGATIF =
   distance haut de la carte → bas de la rangée + gap de rangée 16 px (donc
   Stats + « À réviser » + leurs gaps), posée par liftMarge() via --revlift
   (0 si pas de carte → marge à sa place normale). Une marge négative ne
   change PAS la hauteur de la rangée : les blocs ne sont jamais repoussés
   (contrairement à une grille "hero marge"/"main marge" qui étirerait la
   rangée 1). ≥1025 px seulement — en dessous #home est display:block et
   l'ordre du DOM suffit. */
@media (min-width:1025px){.margewrap{margin-top:calc(-1 * var(--revlift,0px))}}
/* PREMIÈRE VISITE (2026-08-24, Cid) : « Tes points faibles » n'apparaît que
   après les premiers entraînements — en attendant la colonne de 320 px est
   VIDE et tout le contenu semble collé à gauche. → #home replié en UNE
   colonne pleine largeur (comme en ≤1024 px) : blocs du hero à 100 %, marge
   masquée, sélecteurs de la topbar réalignés (règle ci-dessus).
   :has(#statsExtra:empty) suit le DOM — dès que le panneau apparaît, retour
   automatique aux 2 colonnes : zéro JS, zéro écouteur. Vieil navigateur
   sans :has → règles ignorées → ancien comportement (même repli que la
   règle topbar ci-dessus). */
@media (min-width:1025px){
  #home:has(#statsExtra:empty){grid-template-areas:"hero" "main";grid-template-columns:1fr}
  #home:has(#statsExtra:empty) .marge{display:none}
  #home:has(#statsExtra:empty) .hero .statgrid,
  #home:has(#statsExtra:empty) #revSlot,
  #home:has(#statsExtra:empty) #lvlSlot{width:100%}
}
.margewrap .margin-note{margin:0;margin-left:auto}
#noteTop{display:none}
/* La marge porte « Points faibles » (#statsExtra) en PANNEAU STANDARD —
   carton, bordure, ombre, h2 20 px + trait de plume, comme les autres blocs
   de l'accueil (plus de « décartonnage » en notes manuscrites : jugé trop
   discret, 2026-08-22) — REMONTÉ au niveau de la carte « Niveau » (2026-08-22,
   voir la règle .margewrap ci-dessus). La carte Niveau et « À réviser »
   (#revSlot) sont dans la rangée du hero ; « Par thème » (#bySubSlot) reste
   en colonne principale sous l'entraînement. */
@media (max-width:1024px){
  #home{display:block}
  /* Plus de colonne principale à ne pas dépasser (blocs empilés pleine
     largeur) → carte et stats repassent pleine largeur (.hero .statgrid a une
     spécificité 0,2,0 : il faut la même cible pour la battre en ≤1024 px). */
  #revSlot,.hero .statgrid{width:100%}
  .margewrap{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
}
@media (max-width:600px){
  .margewrap{grid-template-columns:1fr}
}
.playhead{margin:24px 0 16px}
.qcard{
  background:var(--surface);border:1px solid var(--line);

  padding:24px;animation:pop .3s var(--ease);

.prompt{margin:0 0 24px;font:400 clamp(21px,3.6vw,27px)/1.6 var(--f-display);text-wrap:pretty}
.prompt .m{font-style:italic}
/* Fraction empilée — numérateur au-dessus du dénominateur, barre de fraction entre les deux.

.frac{

.opt:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}

.explain{

  background:var(--surface);font:400 15.5px/1.65 var(--f-body);
}
.explain.good{border-left-color:var(--good)}
.explain.bad{border-left-color:var(--bad)}
.explain .m{font-family:var(--f-display);font-style:italic}
.explain h4{margin:0 0 4px;font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nextrow{margin-top:16px;display:flex;justify-content:flex-end}
.timerbox{display:flex;align-items:center;gap:10px}
.timer-ring{
  width:52px;height:52px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p,1)*1turn),var(--line) 0);
  display:grid;place-items:center;
}
.timer-ring .in{
  width:40px;height:40px;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;font:600 15px var(--f-mono);
}
.result{text-align:center;padding:10px 6px}
.result .big{font:700 56px/1 var(--f-display);color:var(--accent);letter-spacing:-.02em}
.result h3{margin:10px 0 4px;font:600 20px var(--f-display)}
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* ===== Révélation d'arrivée — cascade douce de haut en bas, d'une traite =====
   100 % CSS : les éléments sont VISIBLES par défaut et l'animation se joue une
   seule fois au chargement. Même si le JS ne s'exécute pas (ou meurt en route),
   rien ne peut rester bloqué invisible. */
/* --boot-k : multiplicateur des délais de la cascade (1 par défaut =
   chorégraphie complète à la première visite ; compressé en mode « switch »
   → le premier mouvement part quasi immédiatement après le clic) */
html.boot [data-rv]{animation:rvIn .85s var(--ease) both;animation-delay:calc(var(--d,0s)*var(--boot-k,1))}
@keyframes rvIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* Les tuiles de thèmes défilent à leur tour pendant le premier chargement */
html.boot .subcard{animation:rvIn .7s var(--ease) both;animation-delay:calc((.95s + var(--cd,0ms))*var(--boot-k,1))}
/* Transition douce entre l'accueil et l'écran d'exercice */
#home.screen-in,#play.screen-in{animation:screenIn .4s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  [data-rv]{opacity:1!important;transform:none!important}
  h1 .wr>span,.slogan .wr>span{transform:none!important;opacity:1!important}
  .slogan .soft{opacity:1!important;transform:none!important}
}
/* Thème : transition douce des couleurs pendant la bascule.
   Classe .theming posée ~500 ms sur <html> au changement de thème.
   Spécificité html.theming > .btn/.subcard/… → écrase les transitions
   habituelles (hover) uniquement pendant cette courte fenêtre. */
@media (prefers-reduced-motion: no-preference){
  html.theming :is(.panel,.subcard,.btn,.chip,.stat,.seg,.seg-btn,.theme-btn,.opt,.ans input,.explain,.qcard,.weakbar,.substatrow,.substathead,.prompt,.qeyebrow,.weaknm,.fb,.lede,.slogan,.note,.brand,.margin-note){
    transition:background-color .45s var(--ease),border-color .45s var(--ease),color .45s var(--ease);
  }
  /* Le logo (SVG) : ses couleurs sont des strokes, pas du color/background. */
  html.theming .brandmark *{transition:stroke .45s var(--ease)}
  /* Les éléments dont la COULEUR (pas le fond) lit var(--accent) :
     mot en italique du titre, noms de chapitre — ajoutés pour la bascule
     de matière (violet PC) et les changements de thème. */
  html.theming :is(h1 em,.slogan .sai,.subcard .nm,.substatrow b,.weaknm){transition:color .45s var(--ease)}
  html.theming .slogan .sai .pen path{transition:stroke .45s var(--ease)}
}
/* Confettis : pluie de papier colorée (révision finie / palier de niveau).
   Chaque pièce porte --drift (écart horizontal) et --rot (rotation totale). */
.confetti-host{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-host i{position:absolute;top:-24px;border-radius:2px;will-change:transform,opacity}
@keyframes confFall{
  from{transform:translate(0,0) rotate(0);opacity:1}
  to{transform:translate(var(--drift,0px),105vh) rotate(var(--rot,540deg));opacity:.05}
}
/* Montée de niveau (2026-08-23, sur demande) : REMPLACE les confettis au
   franchissement de palier (les confettis restent à la fin de révision).
   Carte au centre de l'écran — le niveau quitté apparaît, la barre se
   remplit, puis le NOUVEAU niveau s'affiche grossi et la barre revient à la
   progression réelle. pointer-events:none → ne bloque jamais la partie ;
   auto-nettoyage ~2,7 s. prefers-reduced-motion : transitions coupées,
   l'animation se lit en affichage/texte uniquement (pas de mouvement). */
/* Montée de niveau : overlay plein écran (non interactif) — LE moment « palier ».
   Séquence : la carte arrive en spring → l'anneau se remplit (≈1 s) → le grand
   numéro tick N→N+1 (pop + halo + gerbe d'étincelles) → fondu. ≈2,7 s, décoratif
   (aria-hidden), désactivé sous prefers-reduced-motion (carte statique). */
.lvlup{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s var(--ease)}
.lvlup>*{grid-area:1/1}
.lvlup.go{opacity:1}
.lvlup.bye{opacity:0}
.lvlup-glow{
  position:absolute;left:50%;top:50%;width:min(560px,96vw);height:min(560px,96vw);border-radius:50%;
  background:radial-gradient(closest-side,var(--accent-soft),transparent 72%);
  opacity:0;transform:translate(-50%,-50%) scale(.55);
  transition:opacity .55s var(--ease),transform .7s cubic-bezier(.2,1.3,.4,1);
}
.lvlup.go .lvlup-glow{opacity:.85;transform:translate(-50%,-50%) scale(1)}
.lvlup.up .lvlup-glow{opacity:1;transform:translate(-50%,-50%) scale(1.14)}
.lvlup-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 44px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transform:scale(.7);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.lvlup.go .lvlup-card{transform:scale(1)}
.lvlup-kick{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.lvlup-numwrap{position:relative;width:160px;height:160px;display:grid;place-items:center}
.lvlup-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.lvlup-ring circle{fill:none;stroke-width:4}
.lvlup-ring .ring-bg{stroke:var(--accent-soft)}
/* 1,4 s (et non 1 s) — 2026-08-24, Cid : le remplissage était jugé trop
   rapide. COUPLÉ au setTimeout du swap de numéro dans levelUp() : ce
   dernier doit rester APRÈS la fin du remplissage (0,15 + 1,4 = 1,55 s). */
.lvlup-ring .ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease) .15s}
.lvlup-num{font:700 60px/1 var(--f-display);color:var(--muted);transition:color .3s var(--ease)}
.lvlup.up .lvlup-num{color:var(--accent);animation:numPop .55s var(--ease);filter:drop-shadow(0 3px 10px var(--accent))}
@keyframes numPop{0%{transform:scale(.45)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.lvlup-nm{font:600 15px var(--f-body);color:var(--muted)}
.lvlup-sparks{position:absolute;inset:0}
.lvlup-sparks i{position:absolute;left:50%;top:50%;border-radius:50%;opacity:0}
.lvlup.up .lvlup-sparks i{animation:sparkFly .95s var(--ease) forwards}
@keyframes sparkFly{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  18%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15)}
}
@media (prefers-reduced-motion:reduce){
  .lvlup,.lvlup-card,.lvlup-glow,.lvlup-num,.lvlup-ring .ring-fg{transition:none;animation:none}
  .lvlup-sparks{display:none}
}
/* Pulse du chip « score » quand la réponse est juste. */
@keyframes chipPulse{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.chip.pulse{animation:chipPulse .5s var(--ease)}
/* ===== Mini-visuels SVG (pédagogie) =====
   Deux phases : "q" = image neutre SANS nombres (n'indique jamais la réponse),
   "c" = image complète avec les éléments de la réponse (tangente, racines,
   triangle, flèches) — affichée uniquement dans la correction. */
.viz{margin:2px 0 16px;text-align:center}
.viz-ans{margin:8px 0 12px}
.viz svg{width:min(400px,100%);height:auto;display:block;margin:0 auto}
.vz-grid{stroke:var(--line);stroke-width:1}
.vz-axis{stroke:var(--muted);stroke-width:1.4;opacity:.75}
.vz-curve{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.vz-pt{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.vz-ans{stroke:var(--good);stroke-width:2.6;stroke-linecap:round}
.vz-ans-bad{stroke:var(--bad);stroke-width:2.6;stroke-linecap:round}
.vz-anspt{fill:var(--good);stroke:var(--surface);stroke-width:2}
.vz-leg{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4;opacity:.7}
.vz-circ{fill:none;stroke:var(--muted);stroke-width:1.6}
.vz-ray{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.vz-lbl{font:500 11.5px var(--f-mono);fill:var(--muted)}
.vz-lbl-ans{font:700 12.5px var(--f-mono);fill:var(--good)}
/* La courbe se trace doucement à l'apparition (pathLength="1" sur le path).
   Hors "prefers-reduced-motion" : aucune dasharray → courbe visible d'emblée. */
@media (prefers-reduced-motion: no-preference){
  .viz .vz-curve{stroke-dasharray:1;stroke-dashoffset:1;animation:vzDraw .9s var(--ease) .12s forwards}
}
@keyframes vzDraw{to{stroke-dashoffset:0}}
/* ===== Version TÉLÉPHONE (html[data-ui="m"]) =====
   Mode EXPLICITE (détection au 1er passage ou bascule topbar 🖥/📱),
   indépendant de la largeur de la fenêtre : le même rendu que sur un vrai
   téléphone, même en paysage. Posé en FIN de <style> + attribut
   [data-ui="m"] = plus de spécificité que le reste du fichier → ces règles
   gagnent sans !important (même celles des @media ci-dessus).
   Moteur, stats, matières : INCHANGÉS — seul l'affichage change. */
html[data-ui="m"] body{font-size:clamp(16px,4.8vw,19px)}
/* ---- Topbar : basculeur matière en grille 2×2 (boutons RESERRÉS, « Physique-Chimie »
   tient sur UNE ligne grâce au min-width:0 — plus de débordement à 320 px) ---- */
html[data-ui="m"] .topbar .wrap{flex-wrap:wrap;row-gap:6px}
html[data-ui="m"] body:has(#home:not([hidden])) .topbar .wrap{padding-right:20px}
html[data-ui="m"] .topbar .seg{display:flex;width:100%;flex-wrap:wrap;row-gap:clamp(4px,1.2vw,6px)}
html[data-ui="m"] .topbar .seg .seg-btn{flex:1 1 42%;min-width:0;padding:clamp(4px,1.3vw,6px) 7px;font-size:clamp(11px,2.9vw,12.5px)}
/* Topbar : boutons de thème RESERRÉS fort (alignés sur la compacité des matières). */
html[data-ui="m"] .theme-btn{padding:clamp(4px,1.3vw,6px) 7px;font-size:clamp(11px,2.9vw,12.5px)}
/* Ligne du thème (Auto/Clair/Sombre) : CENTRÉE sur téléphone (2026-08-25, Cid).
   Le séparateur vertical (1 px) perd son sens une fois les lignes empilées →
   masqué sur mobile (il reste sur ordinateur, où il sépare matières | thème). */
html[data-ui="m"] .topbar .divider{display:none}
html[data-ui="m"] .topbar .row.wrap-row{justify-content:center}
/* Pendant les questions : la topbar (marque + matières + thème + puces
   score/série/passées) ne sert que sur l'accueil — sur téléphone elle
   disparaît pour libérer toute la place à l'énoncé (2026-08-25, Cid).
   L'écran de question a déjà « ← Quitter » pour revenir.
   Vieil navigateur sans :has → règle ignorée → ancien comportement. */
html[data-ui="m"] body:has(#play:not([hidden])) .topbar{display:none}
/* Topbar qui ne reste pas « figée » au scroll (téléphone, 2026-08-25, Cid) :
   elle ne demeure qu'EN HAUT de page — au scroll vers le bas elle glisse
   hors de vue (pour libérer l'écran), et revient EN COURS DE REMONTÉE, pas
   seulement tout en haut (2026-08-26, Cid : « réapparaisse plus tôt » —
   seuil 60 px). La classe .topbar-off est posée par l'écouteur scroll en
   fin de script (seuil 60 px). transform → glisse fluide, zéro
   reflow. Ordinateur : attribut data-ui absent → règle sans effet (topbar
   sticky comme avant).
   Disparition / réapparition PROGRESSIVES, ASYMÉTRIQUES (2026-08-25, Cid —
   « accélérer la réapparition ») : glissement + fondu doux, disparition
   (classe .topbar-off AJOUTÉE) ~0,7 s, réapparition (classe RETIRÉE) ~0,12 s.
   Mécanique : le CSS lit la transition de l'ÉTAT D'ARRIVÉE de chaque
   changement → la transition lente est déclarée DANS .topbar-off, la rapide
   DANS .topbar. Les deux sont déclarées SANS media-query : les vieux
   navigateurs qui ne connaissent pas prefers-reduced-motion ignoreraient un
   bloc @media entier et le masquage serait brutal ; les appareils qui
   demandent VRAIMENT le mouvement réduit sont couverts par la règle globale
   de l'app (prefers-reduced-motion:reduce → transitions coupées). */
html[data-ui="m"] .topbar.topbar-off{transform:translateY(calc(-100% - 2px));opacity:0;transition:transform .7s var(--ease),opacity .6s var(--ease)}
html[data-ui="m"] .topbar{transition:transform .12s var(--ease),opacity .1s var(--ease)}
/* ---- Accueil : TOUJOURS une colonne (même ≥1025 px : le mode est explicite) ---- */
html[data-ui="m"] #home{display:block}
html[data-ui="m"] #revSlot,html[data-ui="m"] #lvlSlot,html[data-ui="m"] .statgrid{width:100%}
/* Écart stats → « Entraînement libre » = 16 px, identique à l'écart carte de
   niveau → stats (le gap interne de .hero). Avant : les deux blocs étaient
   collés (0 px) — .home-main n'avait aucune marge en flux bloc. */
html[data-ui="m"] .home-main{margin-top:16px}
html[data-ui="m"] .margewrap{position:static;display:grid;grid-template-columns:1fr;gap:clamp(14px,3.6vw,20px);align-items:start;margin-top:0}
/* Hero un peu plus resserré pour une main de poche. */
html[data-ui="m"] h1{font-size:clamp(34px,9vw,44px);margin-top:clamp(20px,5.5vw,32px)}
html[data-ui="m"] .slogan{font-size:clamp(18px,4.6vw,21px)}
html[data-ui="m"] .lede{font-size:clamp(13px,3.5vw,14.5px)}
/* Stats en grille 2×2 (4 stats) : « questions passées » masquée sur mobile pour
   gagner de la place (elle reste sur ordinateur, où l'auto-fit l'absorbe). */
html[data-ui="m"] .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-ui="m"] .stat-skips{display:none}
/* Tuiles de thèmes : 2 colonnes, RESERRÉES (moins de place) — on compresse
   le padding de la tuile, son espacement interne, et les polices de nom/progression. */
html[data-ui="m"] .subgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,1.8vw,10px)}
html[data-ui="m"] .subcard{padding:clamp(7px,2vw,9px);gap:3px}
html[data-ui="m"] .subcard .nm{font-size:14px;line-height:1.2}
html[data-ui="m"] .subcard .pc{font-size:11px}
/* Panneau « Par thème » : la grille 4 colonnes (nom 1fr + colonnes fixes
   56/73,6/62,4 px + 3 gaps de 8 px) laisse MOINS que la largeur min-content
   du nom sur un téléphone : l'item de grille refuse de rétrécir (min-width
   auto) et le nom pousse la colonne « série » HORS du panneau — débordement
   mesuré 6→49 px à 320 px, 9 px à 360 px (sonde CDP 2026-08-22).
   Version mobile : colonnes fixes resserrées + gap plus fin, et c'est le NOM
   seul qui rétrécit (ellipsis), jamais un débordement. */
html[data-ui="m"] .substathead,html[data-ui="m"] .substatrow{grid-template-columns:minmax(0,1fr) 3rem 4.4rem 3.4rem;gap:5px;padding:4px 2px}
html[data-ui="m"] .substathead span,html[data-ui="m"] .substatrow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Boutons : cibles tactiles confortables, texte plus lisible — tailles FLUIDES (clamp min→max). */
html[data-ui="m"] .btn{padding:clamp(13px,3.4vw,16px) clamp(20px,5.2vw,26px);font-size:clamp(16px,4.2vw,18px)}
html[data-ui="m"] .btn.small{padding:clamp(11px,3vw,15px) clamp(14px,3.8vw,18px);font-size:clamp(14px,3.8vw,15.5px)}
/* Boutons de NIVEAU (Facile/Moyen/Difficile/Auto) = MÊMES DIMENSIONS que l'ANNÉE
   (font-size:13px + padding:5px 10px, identiques à .picks .seg-year .seg-btn).
   Cette règle générique .seg-btn ne s'applique plus qu'à eux : les MATIÈRES et le
   THÈME ont leur règle plus haute (spécificité), et l'ANNÉE garde sa règle propre. */
html[data-ui="m"] .seg-btn{padding:5px 10px;font-size:13px}
/* Tête « Entraînement libre » : sur téléphone, les sélecteurs passent sous le
   titre (pleine largeur) et leurs boutons peuvent REPLIER sur 2 lignes si la
   largeur est trop petite — mieux vaut 2 lignes qu'un débordement. */
html[data-ui="m"] .lead-head{flex-direction:column;align-items:stretch}
html[data-ui="m"] .picks{align-items:stretch}
html[data-ui="m"] .picks .seg{width:100%;justify-content:center;flex-wrap:wrap;row-gap:3px}
/* Case « Maths expertes » : RÉDUITE sur téléphone (2026-08-26, Cid :
   « réduire la taille du bouton ») — repasse près du gabarit desktop
   (13 px / padding 5×10) au lieu de l'agrandissement mobile précédent. */
html[data-ui="m"] .xopt{padding:8px 12px;font-size:13.5px}
html[data-ui="m"] .xopt input{width:15px;height:15px}
/* « À réviser » : cellules empilées, séparateurs plume masqués, bouton pleine largeur. */
html[data-ui="m"] .hero .revcta{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:clamp(10px,2.8vw,16px)}
html[data-ui="m"] .hero .revcta .revsep{display:none}
html[data-ui="m"] .hero .revcta .btn{width:100%}
/* ---- Écran de question : agrandi pour le pouce ---- */
/* 2026-08-25 (Cid) : dé-cluttering de la barre de question sur téléphone —
   « ne laisser que le nombre de question et le niveau » : les puces chapitre,
   classe ET difficulté sont masquées ; on garde « question N » et la puce
   niveau XP « Niv. N » (+ sa barre). Desktop : les trois puces restent. */
html[data-ui="m"] #chipSub,html[data-ui="m"] #chipYear,html[data-ui="m"] #chipLvl{display:none}
html[data-ui="m"] .prompt{font-size:clamp(22px,4.6vw,26px)}
html[data-ui="m"] .ans input{height:clamp(46px,12.5vw,56px);width:100%;font-size:clamp(16px,4.4vw,19px)}
html[data-ui="m"] .ans .btn{height:clamp(46px,12.5vw,56px);padding:0 clamp(18px,5vw,24px);font-size:clamp(15.5px,4.2vw,17px)}
html[data-ui="m"] .opt{padding:clamp(12px,3.4vw,16px) clamp(14px,3.8vw,18px)}
/* Tactile : manipulation = le navigateur ne cherche plus le double-tap « zoom »
   avant le tap → cibles réactives, pas de zoom parasite sur iOS/Android. */
html[data-ui="m"] button,html[data-ui="m"] input{touch-action:manipulation}

<script>
"use strict";
/* ================= UTILS ================= */
const $=s=>document.querySelector(s);
const Ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;      /* entier aléatoire [a,b] */
const pick=a=>a[Ri(0,a.length-1)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const fr=(n,d)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);return{n:n/g,d:d/g};};
/* ---------- Affichage des fractions : empilées (numérateur / dénominateur + barre) ---------- */
const fracHTML=(nu,de)=>`<span class="frac"><span>${nu}</span><span>${de}</span></span>`;
const FR=(n,d)=>{if(d<0){n=-n;d=-d;}return n<0?"−"+fracHTML(-n,d):fracHTML(n,d);};  /* fraction telle qu'écrite (non simplifiée) */
const F=(n,d)=>{const f=fr(n,d);if(f.d===1)return f.n<0?"−"+(-f.n):String(f.n);return FR(f.n,f.d);}; /* fraction simplifiée */
const fs=(n,d)=>F(n,d);   /* affichage d'une réponse fraction (fraction empilée) */
const fa=(n,d)=>fr(n,d);   /* réponse "fraction" : {n,d} simplifiée */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
/* Exposants Unicode (2026-08-24, Cid) : rend un entier en superscript typographique
   (2 → «²», −12 → «⁻¹²») pour les énoncés maths — plus lisible que «^2».
   Un caractère hors chiffres/minus se replie tel quel (jamais d'erreur). */
const SUP={0:"⁰",1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷",8:"⁸",9:"⁹","-":"⁻"};
const sup=(v)=>String(v).split("").map(c=>SUP[c]||c).join("");
const qcm=(p,bonne,ds,explain,viz)=>{const o=shuf([bonne,...ds]);const r={prompt:p,type:"choice",options:o,correct:o.indexOf(bonne),explain};if(viz)r.viz=viz;return r;}; /* QCM : options mélangées, correct = index réel de la bonne option ; viz optionnel (mini-visuel) */
/* QCM numérique (densification 2026-08-25) : même contrat que qcm, mais les leuures
   numériques sont dédupliqués et écartés de la bonne réponse → options toujours non
   vides et distinctes (garde-fou test [7]) même si un leurre retombe sur la bonne. */
const qcmN=(p,bonne,ds,explain)=>{
  const bn=String(bonne);
  const dd=[...new Set(ds.map(x=>String(x)))].filter(x=>x!==bn&&x!=="");
  const o=shuf([bn,...dd]);
  return{prompt:p,type:"choice",options:o,correct:o.indexOf(bn),explain};
};
/* ================= GENERATORS ================= */

/* ---------- SECONDE — Logique & ensembles (nouveau — BO 2026) ---------- */
const G_S2_LOG=[
 {lvl:"facile",make(){
   const builds=[
    // 1. Union |A ∪ B|
    ()=>{const p=pick([2,3,4,5,6]),q=pick([2,3,4,5,6].filter(x=>x!==p));
      const l=(p*q)/gcd(p,q),ca=Math.floor(30/p),cb=Math.floor(30/q),cl=Math.floor(30/l);
      return{prompt:`E = {1, 2, …, 30}. A = les multiples de ${p}, B = les multiples de ${q}. Combien d'éléments contient A ∪ B ?`,
       type:"number",answer:ca+cb-cl,
       explain:`|A| = ${ca}, |B| = ${cb}. A ∩ B = les multiples du PPCM(${p}, ${q}) = ${l}, donc |A ∩ B| = ${cl}.<br>Donc |A ∪ B| = ${ca} + ${cb} − ${cl} = <b>${ca+cb-cl}</b>.`};},
    // 2. Intersection |A ∩ B|
    ()=>{const p=pick([2,3,4,6]),q=pick([3,4,6,9]);
      const l=(p*q)/gcd(p,q),cl=Math.floor(30/l);
      return{prompt:`E = {1, 2, …, 30}. A = les multiples de ${p}, B = les multiples de ${q}. Combien d'éléments contient A ∩ B ?`,
       type:"number",answer:cl,
       explain:`x ∈ A ∩ B ⇔ x est multiple de ${p} ET de ${q}, donc multiple du PPCM(${p}, ${q}) = ${l}.<br>Entre 1 et 30 : <b>${cl}</b> multiples de ${l}.`};},
    // 3. A \ B (dans A, pas dans B)
    ()=>{const p=pick([2,3,4,5]),q=pick([4,6,9,10].filter(x=>x!==p));
      const l=(p*q)/gcd(p,q),ca=Math.floor(30/p),cl=Math.floor(30/l);
      return{prompt:`E = {1, 2, …, 30}. A = les multiples de ${p}, B = les multiples de ${q}. Combien d'éléments sont dans A mais PAS dans B ?`,
       type:"number",answer:ca-cl,
       explain:`|A \ B| = |A| − |A ∩ B|. Ici |A| = ${ca}, et A ∩ B = les multiples du PPCM(${p}, ${q}) = ${l} → |A ∩ B| = ${cl}.<br>Donc ${ca} − ${cl} = <b>${ca-cl}</b>.`};},
    // 4. QCM numérique |A ∪ B| (leuures = oublis de double comptage)
    ()=>{const p=pick([2,3,5]),q=pick([4,6,9].filter(x=>x!==p));
      const l=(p*q)/gcd(p,q),ca=Math.floor(30/p),cb=Math.floor(30/q),cl=Math.floor(30/l);
      return qcmN(`E = {1,…,30}. A = les multiples de ${p}, B = les multiples de ${q}. Combien vaut |A ∪ B| ?`,
       ca+cb-cl,[ca+cb,ca+cb-2*cl,Math.max(ca,cb)],
       `|A ∪ B| = |A| + |B| − |A ∩ B| = ${ca} + ${cb} − ${cl} = <b>${ca+cb-cl}</b> (on soustrait une seule fois les ${cl} multiples de ${l}, comptés deux fois).`);}
   ];
   return pick(builds)();
 }},
 {lvl:"moyen",make(){
   const B=[
    {p:"Tout carré d'un entier est positif.",n:"Il existe un entier dont le carré n'est pas positif.",w:"Aucun carré d'entier n'est positif."},
    {p:"Tout multiple de 4 est un multiple de 2.",n:"Il existe un multiple de 4 qui n'est pas un multiple de 2.",w:"Tout multiple de 2 est un multiple de 4."},
    {p:"Il existe x ∈ ℝ tel que x² = −1.",n:"Pour tout x ∈ ℝ, x² ≠ −1.",w:"Aucun nombre réel n'a de carré."},
    {p:"Tout entier est un nombre rationnel.",n:"Il existe un entier qui n'est pas rationnel.",w:"Tous les rationnels sont des entiers."},
    {p:"Si a > b alors a² ≥ b².",n:"Il existe a > b avec a² < b².",w:"Si a > b alors a² < b²."},
    {p:"a · 0 = 0 pour tout réel a.",n:"Il existe a avec a · 0 ≠ 0.",w:"0 · 0 ≠ 0."},
    {p:"Il existe un nombre décimal négatif.",n:"Aucun nombre décimal n'est négatif.",w:"Tous les décimaux sont positifs."},
    {p:"Tout nombre pair est divisible par 2.",n:"Il existe un pair qui n'est pas divisible par 2.",w:"Tout multiple de 2 est pair (c'est la même chose)."}
   ];
   const builds=[
    // 1. « Quelle est la négation de P ? »
    ()=>{const b=pick(B);
      return qcm(`Quelle est la négation de la proposition « ${b.p} » ?`,b.n,[b.w,pick(B.filter(x=>x!==b)).w,pick(B.filter(x=>x!==b)).p],
       `Négation de « tout A est B » = « il existe un A qui n'est pas B » ; négation de « il existe… » = « aucun… ».<br>→ « ${b.n} ».`);},
    // 2. Vrai/Faux : « N est la négation de P ? »
    ()=>{const b=pick(B);const vrai=pick([true,false]);
      const montrée=vrai?b.n:pick([b.w,...B.filter(x=>x!==b).slice(0,3).map(x=>x.n)]);
      const bonne=vrai?"Vrai":"Faux";
      return qcm(`L'affirmation « ${montrée} » est-elle la négation correcte de « ${b.p} » ?`,bonne,
       [vrai?"Faux":"Vrai"],
       vrai?`Oui — c'est bien la négation : <b>${b.n}</b>.`:`Non — la négation correcte est « ${b.n} ». « ${montrée} » ne le change pas (ou la reformule mal).`);},
    // 3. « Laquelle est la négation de P ? » (3 négations d'autres props + la bonne)
    ()=>{const b=pick(B);
      const autres=shuf(B.filter(x=>x!==b)).slice(0,3).map(x=>x.n);
      return qcm(`Laquelle de ces propositions est la négation de « ${b.p} » ?`,b.n,autres,
       `On nie la quantification : « tout → il existe un contre-exemple » ou « il existe → aucun ».<br>→ « ${b.n} ».`);}
   ];
   return pick(builds)();
 }},
 {lvl:"difficile",make(){
   const V=[
    {t:"x² > 0 pour tout réel x",f:1,c:"x = 0 donne x² = 0, pas > 0"},
    {t:"x² ≥ 0 pour tout réel x",f:0},
    {t:"a · 0 = 0 pour tout réel a",f:0},
    {t:"si x ≠ 0, alors 1/x existe",f:0},
    {t:"le produit de deux nombres pairs est pair",f:0},
    {t:"la somme de deux nombres impairs est impaire",f:1,c:"3 + 5 = 8, qui est pair"},
    {t:"un nombre qui finit par 5 est divisible par 5",f:0},
    {t:"n = 15 est un multiple de 3 et de 5",f:0},
    {t:"√2 est un nombre rationnel",f:1,c:"√2 ne s'écrit jamais sous forme a/b"},
    {t:"si n est pair, alors n² est pair",f:0},
    {t:"tout multiple de 6 est pair",f:0},
    {t:"tout multiple de 3 est un multiple de 6",f:1,c:"3 et 9 sont multiples de 3, pas de 6"},
    {t:"l'opposé de −a est a",f:0},
    {t:"a + b = b + a seulement si a = b",f:1,c:"1 + 2 = 2 + 1 alors que 1 ≠ 2"}
   ];
   const builds=[
    // 1. « Laquelle est FAUSSE ? »
    ()=>{const faux=pick(V.filter(v=>v.f===1));
      const trois=shuf(V.filter(v=>v.f===0)).slice(0,3).map(v=>v.t);
      return qcm("Laquelle de ces propositions est <b>fausse</b> ?",faux.t,trois,
       `« ${faux.t} » est fausse — contre-exemple : ${faux.c}.<br>Les trois autres propositions sont vraies.`);},
    // 2. « Laquelle est VRAIE ? »
    ()=>{const vraie=pick(V.filter(v=>v.f===0));
      const trois=shuf(V.filter(v=>v.f===1)).slice(0,3).map(v=>v.t);
      return qcm("Laquelle de ces propositions est <b>vraie</b> ?",vraie.t,trois,
       `« ${vraie.t} » est vraie pour tous les cas.<br>Les trois autres ont un contre-exemple.`);}
   ];
   return pick(builds)();
 }}
];

/* ---------- SECONDE — Algorithmique (nouveau — BO 2026) ---------- */
const G_S2_ALGO=[
 {lvl:"facile",make(){
   const builds=[
    // 1. Somme 1..n
    ()=>{const n=Ri(4,12);
      return{prompt:`Algorithme : s ← 0, puis « pour k de 1 à ${n} : s ← s + k ». Quelle est la valeur finale de s ?`,
       type:"number",answer:n*(n+1)/2,
       explain:`s = 1 + 2 + … + ${n} = ${n} × (${n} + 1)/2 = <b>${n*(n+1)/2}</b>.`};},
    // 2. Ajout constant
    ()=>{const n=Ri(3,12);
      return{prompt:`Algorithme : s ← 0, puis « pour k de 1 à ${n} : s ← s + 2 ». Quelle est la valeur finale de s ?`,
       type:"number",answer:2*n,
       explain:`On ajoute 2, ${n} fois : s = ${n} × 2 = <b>${2*n}</b>.`};},
    // 3. Compteur de boucle
    ()=>{const n=Ri(2,15);
      return{prompt:`Algorithme : c ← 0, puis « pour k de 1 à ${n} : c ← c + 1 ». Quelle est la valeur finale de c ?`,
       type:"number",answer:n,
       explain:`La boucle compte ses itérations : une incrémentation par tour, donc c = <b>${n}</b>.`};},
    // 4. QCM numérique (somme 1..n)
    ()=>{const n=Ri(4,12);
      return qcmN(`Algorithme : s ← 0, « pour k de 1 à ${n} : s ← s + k ». Que vaut s à la fin ?`,
       n*(n+1)/2,[n*(n+1),n*n,(n*(n+1))/4],
       `s = 1 + 2 + … + ${n} = ${n}(${n}+1)/2 = <b>${n*(n+1)/2}</b>.`);}
   ];
   return pick(builds)();
 }},
 {lvl:"moyen",make(){
   const builds=[
    // 1. Collatz 3 fois
    ()=>{const x=Ri(1,15)*2+1;let a=x;const tr=[a];
      for(let i=0;i<3;i++){a=(a%2===0)?a/2:3*a+1;tr.push(a);}
      return{prompt:`Algorithme : « si x est pair, x ← x/2 ; sinon x ← 3x + 1 ». En partant de x = ${x} et en appliquant la règle 3 fois, quelle est la valeur de x ?`,
       type:"number",answer:tr[3],
       explain:`Succession des valeurs : ${tr.join(" → ")}.<br>Donc x = <b>${tr[3]}</b>.`};},
    // 2. Somme décalée (départ non nul)
    ()=>{const n=Ri(3,10),m=Ri(1,5);
      return{prompt:`Algorithme : s ← ${n}, puis « pour k de 1 à ${m} : s ← s + k ». Quelle est la valeur finale de s ?`,
       type:"number",answer:n+m*(m+1)/2,
       explain:`On part de ${n} puis on ajoute 1 + 2 + … + ${m} = ${m*(m+1)/2}.<br>Donc s = ${n} + ${m*(m+1)/2} = <b>${n+m*(m+1)/2}</b>.`};},
    // 3. Boucle « tant que » addition
    ()=>{const N=Ri(6,40),k=Ri(2,5);
      let s=0;while(s<N)s+=k;
      return{prompt:`Algorithme : s ← 0, puis « tant que s < ${N} : s ← s + ${k} ». Quelle est la valeur finale de s ?`,
       type:"number",answer:s,
       explain:`s augmente de ${k} à chaque tour : 0, ${k}, ${2*k}, … Dès que s ≥ ${N} la boucle s'arrête.<br>La plus petite multiple de ${k} au moins égale à ${N} vaut <b>${s}</b>.`};},
    // 4. QCM numérique (3ᵉ terme d'une suite)
    ()=>{const x=Ri(1,9);let a=x;const tr=[a];
      for(let i=0;i<4;i++){a=2*a+1;tr.push(a);}
      return qcmN(`Algorithme : « x ← 2x + 1 ». En partant de x = ${x}, quel est le terme obtenu après 3 applications ?`,
       tr[3],[tr[2],tr[4],2*x+1],
       `Termes successifs : ${tr.slice(0,4).join(" → ")}. Après 3 applications, x = <b>${tr[3]}</b>.`);}
   ];
   return pick(builds)();
 }},
 {lvl:"difficile",make(){
   const builds=[
    // 1. Plus petite puissance de 2 ≥ N
    ()=>{const N=Ri(5,500);let s=1;while(s<N)s*=2;
      return{prompt:`Algorithme : s ← 1, puis « tant que s < ${N} : s ← s × 2 ». Quelle est la valeur finale de s ?`,
       type:"number",answer:s,
       explain:`s double à chaque tour : 1, 2, 4, 8, …<br>La boucle s'arrête dès que s ≥ ${N} : la plus petite puissance de 2 au moins égale à ${N} est <b>${s}</b>.`};},
    // 2. Dénombrement de tours
    ()=>{const N=Ri(5,120);let s=1,c=0;while(s<N){s*=2;c++;}
      return{prompt:`Algorithme : s ← 1, puis « tant que s < ${N} : s ← s × 2 ». Combien de tours la boucle effectue-t-elle ?`,
       type:"number",answer:c,
       explain:`s prend 1, 2, 4, … On compte les doublages avant d'atteindre ≥ ${N} : après ${c} tours, s = ${1<<c} ≥ ${N}.<br>Donc <b>${c}</b> tours.`};},
    // 3. Boucle décrémentation
    ()=>{const N=Ri(10,60),k=Ri(2,4);let s=N,c=0;while(s>0){s-=k;c++;}
      return{prompt:`Algorithme : s ← ${N}, puis « tant que s > 0 : s ← s − ${k} ». Combien de tours ?`,
       type:"number",answer:c,
       explain:`s diminue de ${k} à chaque tour, en s'arrêtant dès que s ≤ 0.<br>Nombre de tours = ⌈${N}/${k}⌉ = <b>${c}</b>.`};},
    // 4. QCM numérique (plus petit multiple ≥ 100)
    ()=>{const N=pick([7,9,11,13,17,19,23,29]);let s=N;while(s<100)s+=N;
      return qcmN(`Algorithme : s ← ${N}, puis « tant que s < 100 : s ← s + ${N} ». Que vaut s à la fin ?`,
       s,[N*Math.floor(100/N),N*(Math.floor(100/N)-1),100],
       `s prend les multiples de ${N} : ${N}, ${2*N}, … On s'arrête au premier multiple de ${N} ≥ 100 : <b>${s}</b>.`);}
   ];
   return pick(builds)();
 }}
];

let _s2flip=0; /* alternance PGCD / PPCM entre tirages consécutifs */
/* ---------- SECONDE — Nombres & algèbre (fusion « Nombres & calcul » + « Équations » + « 2e degré ») ---------- */
const G_S2_NUM=[
 {lvl:"facile",make(){
   const builds=[
    // 1. Produit : addition des exposants
    ()=>{const a=Ri(2,7),b=Ri(0,4);
      return{prompt:`Calcule 2${sup(a)} × 2${sup(b)} = 2<sup>c</sup>. Quel est c ?`,
       type:"number",answer:a+b,
       explain:`Même base : on additionne les exposants — ${a} + ${b} = <b>${a+b}</b>.`};},
    // 2. Quotient : soustraction des exposants
    ()=>{const a=Ri(3,8),b=Ri(0,2);
      return{prompt:`Calcule 2${sup(a)} ÷ 2${sup(b)} = 2<sup>c</sup>. Quel est c ?`,
       type:"number",answer:a-b,
       explain:`Même base : on soustrait les exposants — ${a} − ${b} = <b>${a-b}</b>.`};},
    // 3. Puissance d'une puissance : multiplication des exposants
    ()=>{const a=Ri(2,5),b=Ri(2,4);
      return{prompt:`Calcule (2${sup(a)})${sup(b)} = 2<sup>c</sup>. Quel est c ?`,
       type:"number",answer:a*b,
       explain:`Puissance d'une puissance : on multiplie les exposants — ${a} × ${b} = <b>${a*b}</b>.`};},
    // 4. QCM numérique (produit de puissances)
    ()=>{const a=Ri(2,6),b=Ri(1,4);
      return qcmN(`Calcule 2${sup(a)} × 2${sup(b)} = 2<sup>c</sup>. Que vaut c ?`,
       a+b,[a+b+1,a*b,a*b-1],
       `Même base : on additionne les exposants — ${a} + ${b} = <b>${a+b}</b>.`);}
   ];
   return pick(builds)();
 }},
 {lvl:"moyen",make(){
   const builds=[
    // 1. PGCD / PPCM (alternance conservée)
    ()=>{const pgcd=(++_s2flip)%2===0;
      const p=pick([[12,18],[16,24],[20,30],[21,35],[36,48],[28,42],[45,60],[54,72]]);

/* ================= ANNÉE PAR MATIÈRE (spec D2) =================
   L'année est indépendante par matière : on choisit d'abord la matière
   (topbar), puis l'année (sélecteur, maths/PC uniquement). Deux clés,
   une par matière ; DE/EN n'ont pas d'année (elles tournent par niveau
   A2/A2+/B1) → state.annee = null. Valeur inconnue → « premiere »
   (défaut = contenu historique, zéro migration).
   NB : le bloc précède THEME_BY_ID car celui-ci itère YEARS (const) —
   le déclarer après déclencherait un ReferenceError au chargement. */
const YEARS=["seconde","premiere","terminale"];
/* « experte » n'est PLUS une 4ᵉ année (case à cocher depuis le 2026-08-23) :
   SUBJECTS_MATH.experte reste seulement comme POOL des 3 thèmes « maths
   expertes » (complexes, arithmétique, graphes & Markov), activé par
   state.experte en maths × Terminale. MATH_YEARS sert encore à couvrir ces
   3 thèmes dans THEME_BY_ID (les items review/history hérités doivent rester
   résolus). PC/DE/EN n'ont que les 3 années classiques. */
const MATH_YEARS=YEARS.concat(["experte"]);
const yearsFor=m=>YEARS;
const YEAR_KEY={maths:"qz_year_math",pc:"qz_year_pc"};
function readYear(m){
  const k=YEAR_KEY[m];if(!k)return null;
  let v=store.get(k,"premiere");
  /* Migration 2026-08-23 : une clé héritée de l'ancienne 4ᵉ année maths
     (« experte ») → Terminale + case « Expertes » cochée (mêmes 3 thèmes). */
  if(v==="experte"&&m==="maths"){v="terminale";store.set("qz_experte_math",true);state.experte=true;}
  return YEARS.includes(v)?v:"premiere";
}
function yearReady(m){
  if(m!=="maths"&&m!=="pc")return false;
  const R=(m==="pc")?SUBJECTS_PC:SUBJECTS_MATH;
  return yearsFor(m).every(y=>Array.isArray(R[y])&&R[y].length>0);
}
const activeSubjects=()=>{
  if(state.matiere==="de")return SUBJECTS_DE;
  if(state.matiere==="en")return SUBJECTS_EN;
  if(state.matiere==="pc")return SUBJECTS_PC[state.annee];
  const base=SUBJECTS_MATH[state.annee];
  /* Option « Expertes » : TERMINALE maths seulement — ajoute les 3 thèmes du
     programme expertes au pool (8 → 11), sans en faire une 4ᵉ année. */
  return (state.annee==="terminale"&&state.experte)?base.concat(SUBJECTS_MATH.experte||[]):base;
};
const THEME_BY_ID={};
const THEME_YEAR={};   /* 2026-08-24 (Cid) : VRAIE année d'un thème → puce
                          d'année de l'en-tête d'entraînement (Seconde/Première/
                          Terminale). Absent pour DE/EN (pas d'année en langues)
                          → puce masquée. Le pool « experte » n'est servi qu'en
                          Terminale maths → étiqueté « terminale ». */
for(const R of[SUBJECTS_DE,SUBJECTS_EN])R.forEach(s=>THEME_BY_ID[s.id]=s);
for(const y of MATH_YEARS){   /* MATH_YEARS ⊇ YEARS : couvre aussi la clé « experte » = le POOL « Maths expertes » (case à cocher, maths × Terminale) ; PC n'a pas de pool expertes (||[]) */
  (SUBJECTS_MATH[y]||[]).forEach(s=>{THEME_BY_ID[s.id]=s;THEME_YEAR[s.id]=(y==="experte"?"terminale":y);});

/*GEN2C*/
/* ================= GRAPH (mini-visuels SVG) =================
   Dessins pédagogiques en SVG inline — aucune dépendance, reste hors-ligne.
   Règle d'or : les specs sont 100 % JSON-sérialisables (nombres, chaînes,
   tableaux) car une question peut être stockée en localStorage (liste à
   réviser) et rejouée après un rechargement. On stocke donc les
   COEFFICIENTS (a, b, c, k…), jamais de fonctions : vzF() reconstruit f.
   Deux phases :
   - "q" : image NEUTRE (courbe, axes, cercle) sans aucun nombre —
           elle n'indique JAMAIS la réponse ;
   - "c" : image complète avec les éléments de la réponse (tangente,
           racines, triangle sin/cos, flèches de variation) —
           affichée uniquement dans la correction.
   Spécialement : le type "var" NE S'AFFICHE PAS en phase "q" :
   la courbe elle-même montre où f monte/descend. */
const VZ={W:360,H:210,L:40,R:346,T:18,B:186};
function vzF(kind,a,b,c){
  switch(kind){
    case"quad":return x=>a*x*x+b*x+(c||0);
    case"rec": return x=>a/x;
    case"cub": return x=>a*x*x*x+b*x;
    case"exp": return x=>a*Math.exp(x)+b*x;
    case"ln":  return x=>x>0?a*Math.log(x)+b*x:NaN;
    case"sq":  return x=>(a*x+b)*(a*x+b);
    case"lin": return x=>a*x+b;
    case"expx":return x=>a*Math.exp(x)+b*x;
    case"x3m": return x=>x*x*x+(b||0)*x;
    case"lnmx":return x=>x>0?Math.log(x)-x:NaN;
  }
  return null;
}
function vzScale(x0,x1,y0,y1){
  return{
    sx:x=>VZ.L+(x-x0)/(x1-x0)*(VZ.R-VZ.L),
    sy:y=>VZ.B-(y-y0)/(y1-y0)*(VZ.B-VZ.T)
  };
}
/* Tracé d'une courbe : découpe le path quand la valeur explose
   (asymptotes, domaines restreints) — pas de trait vertical parasite. */
function vzCurve(f,x0,x1,n,X,Y,y0,y1){
  const R=(y1-y0)*6,c=(y0+y1)/2;
  let d="",pen=false;
  for(let i=0;i<=n;i++){
    const x=x0+(x1-x0)*i/n;
    let y;try{y=f(x);}catch(e){y=NaN;}
    if(!isFinite(y)||Math.abs(y-c)>R){pen=false;continue;}
    d+=(pen?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)+" ";
    pen=true;
  }
  return d.trim();
}
function vzRange(f,x0,x1,extra){
  let y0=Infinity,y1=-Infinity;
  for(let i=0;i<=40;i++){
    const x=x0+(x1-x0)*i/40;
    const vals=extra?[extra(x)]:[];
    vals.push(f(x));
    for(const v of vals){if(isFinite(v)&&Math.abs(v)<1e4){if(v<y0)y0=v;if(v>y1)y1=v;}}
  }
  if(!isFinite(y0)||y1-y0<2){const c2=isFinite(y0)?(y0+y1)/2:0;y0=c2-2;y1=c2+2;}
  const pad=(y1-y0)*0.18+0.4;y0-=pad;y1+=pad;
  return{y0,y1};
}
/* Grille discrète + axes (si 0 est dans la plage) — volontairement SANS
   graduations numérotées : en phase "q" on ne peut rien lire d'exact. */
function vzAxes(x0,x1,y0,y1,X,Y){
  let s="";
  const span=x1-x0;
  const step=span>16?5:span>8?2:1;
  for(let gx=Math.ceil(x0/step)*step;gx<=x1+1e-9;gx+=step){
    if(Math.abs(gx)<1e-9)continue;
    s+=`<line x1="${X(gx).toFixed(1)}" y1="${VZ.T}" x2="${X(gx).toFixed(1)}" y2="${VZ.B}" class="vz-grid"/>`;
  }
  if(y0<0&&y1>0)s+=`<line x1="${VZ.L}" y1="${Y(0).toFixed(1)}" x2="${VZ.R}" y2="${Y(0).toFixed(1)}" class="vz-axis"/>`;
  if(x0<0&&x1>0)s+=`<line x1="${X(0).toFixed(1)}" y1="${VZ.T}" x2="${X(0).toFixed(1)}" y2="${VZ.B}" class="vz-axis"/>`;
  return s;
}
const vzClip=id=>`<clipPath id="${id}"><rect x="${VZ.L}" y="${VZ.T}" width="${VZ.R-VZ.L}" height="${VZ.B-VZ.T}"/></clipPath>`;
const vzWrap=(inner,label)=>`<svg class="vz" viewBox="0 0 ${VZ.W} ${VZ.H}" role="img" aria-label="${label}">`+inner+`</svg>`;
/* ---------- Dérivées : courbe + point k + (en correction) tangente ---------- */
function vzTan(spec,phase){
  const f=vzF(spec.f,spec.a,spec.b,spec.c);
  if(!f)return"";
  const k=spec.k,m=spec.m,fk=f(k);
  let x0=k-4.5;
  if(spec.f==="ln")x0=Math.max(0.15,k-4.5);
  let x1=k+4.5;
  if(spec.f==="exp"){x1=k+2.4;x0=Math.max(-3,k-3);}
  const g=x=>fk+m*(x-k); /* tangente : y = f(k) + f′(k)(x−k) */
  const {y0,y1}=vzRange(f,x0,x1,g);
  const {sx:X,sy:Y}=vzScale(x0,x1,y0,y1);
  const id="vzclip-"+phase;
  let s=vzAxes(x0,x1,y0,y1,X,Y);
  s+=`<g clip-path="url(#${id})"><path d="${vzCurve(f,x0,x1,80,X,Y,y0,y1)}" class="vz-curve" pathLength="1"/></g>`;
  s+=`<circle cx="${X(k).toFixed(1)}" cy="${Y(fk).toFixed(1)}" r="4.5" class="vz-pt"/>`;
  if(phase==="c"){
    s+=`<g clip-path="url(#${id})"><line x1="${X(x0).toFixed(1)}" y1="${Y(g(x0)).toFixed(1)}" x2="${X(x1).toFixed(1)}" y2="${Y(g(x1)).toFixed(1)}" class="vz-ans"/></g>`;
    const ty=Math.max(VZ.T+14,Math.min(VZ.B-10,Y(g(x1))));
    s+=`<text x="${VZ.R-4}" y="${ty.toFixed(1)}" text-anchor="end" class="vz-lbl-ans">tangente</text>`;
  }
  return vzWrap(vzClip(id)+s,"Courbe de f et point d'abscisse "+k+(phase==="c"?" avec la tangente":""));
}
/* ---------- 2e degré : parabole + (en correction) racines marquées ---------- */
function vzPar(spec,phase){
  const f=vzF("quad",spec.a,spec.b,spec.c);
  const lo=Math.min(spec.r1,spec.r2),hi=Math.max(spec.r1,spec.r2);
  const x0=lo-3,x1=hi+3;
  let{y0,y1}=vzRange(f,x0,x1);
  if(y1<-0.5)y1=2;
  if(y0>0.5)y0=-2;
  const {sx:X,sy:Y}=vzScale(x0,x1,y0,y1);
  const id="vzclip-"+phase;
  let s=vzAxes(x0,x1,y0,y1,X,Y);
  s+=`<g clip-path="url(#${id})"><path d="${vzCurve(f,x0,x1,80,X,Y,y0,y1)}" class="vz-curve" pathLength="1"/></g>`;
  if(phase==="c"){
    for(const r of[spec.r1,spec.r2]){
      s+=`<circle cx="${X(r).toFixed(1)}" cy="${Y(0).toFixed(1)}" r="4.5" class="vz-anspt"/>`;
      s+=`<text x="${X(r).toFixed(1)}" y="${(Y(0)+19).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">${r}</text>`;
    }
  }
  return vzWrap(vzClip(id)+s,"Parabole"+(phase==="c"?" avec les deux racines marquées":""));
}
/* ---------- Trigo : cercle unité + angle + (en correction) triangle ---------- */
function vzUnit(spec,phase){
  const cx=180,cy=110,r=80,A=spec.ang||0;
  const px=cx+r*Math.cos(A),py=cy-r*Math.sin(A);
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" class="vz-circ"/>`;
  s+=`<line x1="${cx-r-10}" y1="${cy}" x2="${cx+r+10}" y2="${cy}" class="vz-axis"/>`;
  s+=`<line x1="${cx}" y1="${cy-r-10}" x2="${cx}" y2="${cy+r+10}" class="vz-axis"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" class="vz-ray"/>`;
  const cosA=Math.cos(A),sinA=Math.sin(A);
  if(A>0.02){
    const ar=26,ax=cx+ar*cosA,ay=cy-ar*sinA;
    s+=`<path d="M ${(cx+ar)} ${cy} A ${ar} ${ar} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" class="vz-ans" opacity="0.55"/>`;
    s+=`<text x="${(cx+44*Math.cos(A/2)).toFixed(1)}" y="${(cy-44*Math.sin(A/2)+4).toFixed(1)}" text-anchor="middle" class="vz-lbl">${spec.angLabel}</text>`;
  }
  if(phase==="c"){
    if(Math.abs(cosA)>0.01&&Math.abs(sinA)>0.01){
      s+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}" y2="${cy}" class="vz-leg"/>`;
      s+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${cx}" y2="${py.toFixed(1)}" class="vz-leg"/>`;
      if(spec.leg==="sin"){
        s+=`<line x1="${px.toFixed(1)}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" class="vz-ans"/>`;
        s+=`<text x="${(px+9).toFixed(1)}" y="${((cy+py)/2+4).toFixed(1)}" class="vz-lbl-ans">${spec.valLabel}</text>`;
      }else{
        s+=`<line x1="${cx}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" class="vz-ans"/>`;
        s+=`<text x="${((cx+px)/2).toFixed(1)}" y="${(py-9).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">${spec.valLabel}</text>`;
      }
    }else{
      /* angle dégénéré (0 ou π/2) : valeur exacte près du point */
      s+=`<text x="${(px+(cosA>0?10:-10)).toFixed(1)}" y="${(py-10).toFixed(1)}" text-anchor="${cosA>0?"start":"end"}" class="vz-lbl-ans">${spec.valLabel}</text>`;
    }
    s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" class="vz-anspt"/>`;
  }
  return vzWrap(s,"Cercle trigonométrique — angle "+spec.angLabel);
}
/* ---------- Variations : courbe + flèches de sens + extremums ----------
   (uniquement en phase correction — jamais en question) */
function vzVar(spec){
  const f=vzF(spec.f,spec.a,spec.b,spec.c);
  if(!f)return"";
  const AR=spec.arrows||[[-7,7,1]];
  let x0=Math.max(-7,Math.min.apply(null,AR.map(a=>a[0])));
  let x1=Math.min(7,Math.max.apply(null,AR.map(a=>a[1])));
  if(spec.f==="lnmx"){x0=Math.max(x0,0.2);x1=Math.min(x1,6);}
  if(spec.f==="expx"){x0=-4;x1=3.5;}
  if(spec.f==="x3m"){x0=-3.2;x1=3.2;}
  const{y0,y1}=vzRange(f,x0,x1);
  const{sx:X,sy:Y}=vzScale(x0,x1,y0,y1);
  const id="vzclip-c";
  let s=vzAxes(x0,x1,y0,y1,X,Y);
  s+=`<g clip-path="url(#${id})"><path d="${vzCurve(f,x0,x1,90,X,Y,y0,y1)}" class="vz-curve" pathLength="1"/></g>`;
  for(const it of AR){
    const a0=it[0],a1=it[1],dir=it[2];
    const c=(a0+a1)/2;
    if(c<x0||c>x1)continue;
    const yv=f(c);
    if(!isFinite(yv))continue;
    let ay=dir>0?Y(yv)-30:Y(yv)+30;
    ay=Math.max(VZ.T+14,Math.min(VZ.B-14,ay));
    const cx=X(c).toFixed(1);
    if(dir>0){
      s+=`<line x1="${cx}" y1="${(ay+16).toFixed(1)}" x2="${cx}" y2="${(ay+2).toFixed(1)}" class="vz-ans"/>`;
      s+=`<path d="M ${cx} ${(ay-8).toFixed(1)} L ${(X(c)-6).toFixed(1)} ${(ay+4).toFixed(1)} L ${(X(c)+6).toFixed(1)} ${(ay+4).toFixed(1)} Z" fill="var(--good)"/>`;
    }else{
      s+=`<line x1="${cx}" y1="${(ay-16).toFixed(1)}" x2="${cx}" y2="${(ay-2).toFixed(1)}" class="vz-ans-bad"/>`;
      s+=`<path d="M ${cx} ${(ay+8).toFixed(1)} L ${(X(c)-6).toFixed(1)} ${(ay-4).toFixed(1)} L ${(X(c)+6).toFixed(1)} ${(ay-4).toFixed(1)} Z" fill="var(--bad)"/>`;
    }
  }
  for(const it of(spec.ex||[])){
    const exx=it[0],eyy=it[1],et=it[2];
    if(exx<x0||exx>x1)continue;
    s+=`<circle cx="${X(exx).toFixed(1)}" cy="${Y(eyy).toFixed(1)}" r="4.5" class="vz-pt"/>`;
    const ly=et==="max"?Y(eyy)-16:Y(eyy)+24;
    s+=`<text x="${X(exx).toFixed(1)}" y="${Math.max(VZ.T+10,Math.min(VZ.B-6,ly)).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">${et}</text>`;
  }
  return vzWrap(vzClip(id)+s,"Étude de variations — courbe de f avec les sens de variation");
}
/* ---------- Visuel "scale" (règle log des grandeurs — marqueurs en correction) ----------
   Kind historique du chapitre « cosmo » (retiré de PC le 2026-08-20) : conservé
   car des specs {kind:"scale"} peuvent subsister en localStorage (liste à
   réviser) — VIZdraw doit rester capable de les dessiner sans planter. */
function vzRatio(spec,phase){
  const r1=Math.max(1,spec.r1||1),r2=Math.max(1,spec.r2||1);
  const p0=Math.floor(Math.log10(Math.min(r1,r2)))-1;
  const p1=Math.ceil(Math.log10(Math.max(r1,r2)))+1;
  const pos=r=>50+(Math.log10(r)-p0)/(p1-p0)*(310-50);
  let s=`<line x1="50" y1="110" x2="310" y2="110" class="vz-axis"/>`;
  for(let p=p0;p<=p1;p++){
    const x=pos(Math.pow(10,p));
    s+=`<line x1="${x.toFixed(1)}" y1="104" x2="${x.toFixed(1)}" y2="116" class="vz-grid"/>`;
    if(phase==="c")s+=`<text x="${x.toFixed(1)}" y="130" text-anchor="middle" class="vz-lbl">10^${p}</text>`;
  }
  if(phase==="c"){
    for(const [r,lab] of[[r1,spec.lab1||""],[r2,spec.lab2||""]]){
      const x=pos(r);
      s+=`<circle cx="${x.toFixed(1)}" cy="110" r="5" class="vz-anspt"/>`;
      s+=`<text x="${x.toFixed(1)}" y="92" text-anchor="middle" class="vz-lbl-ans">${lab}</text>`;
    }
  }
  return vzWrap(s,"Échelle des grandeurs"+(phase==="c"?" avec les deux valeurs":""));
}
/* ---------- PC (newton) : lancer horizontal — point de départ + sol (q), trajectoire + impact (c) ---------- */
function vzProj(spec,phase){
  const h=Math.max(1,spec.h||5),v0=Math.max(0,spec.v0||3),g=Math.max(1,spec.g||10);
  const xi=v0>0?v0*Math.sqrt(2*h/g):0;
  const x1=Math.max(xi,1)*1.15,y1=h*1.3;
  const {sx:X,sy:Y}=vzScale(0,x1,0,y1);
  const id="vzclip-"+phase;
  let s=`<line x1="${VZ.L}" y1="${Y(0).toFixed(1)}" x2="${VZ.R}" y2="${Y(0).toFixed(1)}" class="vz-axis"/>`;
  s+=`<circle cx="${X(0).toFixed(1)}" cy="${Y(h).toFixed(1)}" r="4.5" class="vz-pt"/>`;
  if(phase==="c"){
    if(v0>0){
      const f=x=>h-(g/(2*v0*v0))*x*x;
      s+=`<g clip-path="url(#${id})"><path d="${vzCurve(f,0,xi,60,X,Y,0,y1)}" class="vz-curve" pathLength="1"/></g>`;
      s+=`<line x1="${X(0).toFixed(1)}" y1="${Y(h).toFixed(1)}" x2="${(X(0)+40).toFixed(1)}" y2="${Y(h).toFixed(1)}" class="vz-ray"/>`;
      s+=`<text x="${(X(0)+44).toFixed(1)}" y="${(Y(h)+4).toFixed(1)}" class="vz-lbl-ans">v₀</text>`;
    }else{
      s+=`<line x1="${X(0).toFixed(1)}" y1="${Y(h).toFixed(1)}" x2="${X(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" class="vz-curve" pathLength="1"/>`;
    }
    s+=`<circle cx="${X(xi).toFixed(1)}" cy="${Y(0).toFixed(1)}" r="4.5" class="vz-anspt"/>`;
    s+=`<text x="${X(xi).toFixed(1)}" y="${(Y(0)+18).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">impact</text>`;
  }
  return vzWrap(vzClip(id)+s,"Lancer horizontal"+(phase==="c"?" avec la trajectoire":" — point de départ et sol"));
}
/* ---------- PC (forces/newton) : masse sur support — flèches P ↓ / T ↑ à l'échelle en correction ---------- */
function vzForce(spec,phase){
  const P=Math.max(0,spec.P||0),T=Math.max(0,spec.T||0);
  const cx=180,cy=112,mx=Math.max(P,T,1);
  const len=v=>Math.max(12,56*v/mx);
  let s=`<line x1="90" y1="168" x2="270" y2="168" class="vz-axis"/>`;
  s+=`<rect x="${cx-16}" y="${cy-12}" width="32" height="24" rx="5" fill="var(--accent-soft)" stroke="var(--line)"/>`;
  if(phase==="c"){
    if(P>0){
      const L=len(P);
      s+=`<line x1="${cx}" y1="${cy+12}" x2="${cx}" y2="${cy+12+L}" class="vz-ans-bad"/>`;
      s+=`<path d="M ${cx} ${cy+12+L+8} L ${cx-5} ${cy+12+L-2} L ${cx+5} ${cy+12+L-2} Z" fill="var(--bad)"/>`;
      s+=`<text x="${cx+9}" y="${cy+12+L+4}" class="vz-lbl">P</text>`;
    }
    if(T>0){
      const L=len(T);
      s+=`<line x1="${cx}" y1="${cy-12}" x2="${cx}" y2="${cy-12-L}" class="vz-ans"/>`;
      s+=`<path d="M ${cx} ${cy-12-L-8} L ${cx-5} ${cy-12-L+2} L ${cx+5} ${cy-12-L+2} Z" fill="var(--good)"/>`;
      s+=`<text x="${cx+9}" y="${cy-12-L+4}" class="vz-lbl">T</text>`;
    }
  }
  return vzWrap(s,"Masse sur un support"+(phase==="c"?" avec les forces à l'échelle":""));
}
/* ---------- PC (energie) : bilans d'énergie — barres Ec / Ep / Em, valeurs en correction.
   Indices en <tspan> (SVG) : il n'existe pas de « c » minuscule en indice dans Unicode —
   l'ancien « E꜀ » utilisait U+A700 (lettre « corne de bélier »), ABSENT de toutes les
   polices → rendu « ? »/boîte à l'écran (corrigé 2026-08-24). Eₚ/Eₘ (U+209A/U+2098)
   existaient, mais le tspan uniformise l'indice et reste fiable sur toutes les plateformes. */
function vzBars(spec,phase){
  const sub=(c)=>`<tspan dy="3" font-size="8">${c}</tspan>`;
  const vals=[[`E${sub("c")}`,spec.ek||0],[`E${sub("p")}`,spec.ep||0],[`E${sub("m")}`,spec.em||0]];
  const mx=Math.max(1,Math.max.apply(null,vals.map(v=>v[1])));
  const base=172,top=30,bw=54,gap=30;
  let s="";
  vals.forEach((v,i)=>{
    const x=52+i*(bw+gap);
    s+=`<rect x="${x}" y="${top}" width="${bw}" height="${base-top}" fill="none" stroke="var(--line)"/>`;
    if(phase==="c"&&v[1]>0){
      const h=(base-top)*v[1]/mx;
      s+=`<rect x="${x}" y="${(base-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" fill="var(--accent-soft)" stroke="var(--accent)"/>`;
      s+=`<text x="${x+bw/2}" y="${(base-h-6).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">${v[1]} J</text>`;
    }
    s+=`<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" class="vz-lbl">${v[0]}</text>`;
  });
  s+=`<line x1="40" y1="${base}" x2="330" y2="${base}" class="vz-axis"/>`;
  return vzWrap(s,"Bilan d'énergie"+(phase==="c"?" avec les valeurs":" — barres vides"));
}
/* ---------- PC (moles) : récipient — ménisque + c, n en correction ---------- */
function vzSoln(spec,phase){
  const cx=180,top=40,bot=170,hw=45;
  let s=`<path d="M ${cx-hw} ${top} L ${cx-hw} ${bot-14} Q ${cx-hw} ${bot} ${cx-hw+14} ${bot} L ${cx+hw-14} ${bot} Q ${cx+hw} ${bot} ${cx+hw} ${bot-14} L ${cx+hw} ${top}" fill="none" stroke="var(--muted)" stroke-width="1.6"/>`;
  if(phase==="c"){
    const h=30+0.4*Math.min(80,(spec.n||1)*10);
    const y=bot-14-h;

/* ---------- PC (stoich) : emplacements A/B/C — barres à l'état final + réactif limitant (c) ---------- */
function vzStoich(spec,phase){
  const a=Math.max(1,spec.a||1),b=Math.max(1,spec.b||1),c=Math.max(1,spec.c||1);
  const nA=Math.max(0,spec.nA||0),nB=Math.max(0,spec.nB||0);
  const t=Math.min(nA/a,nB/b),fA=Math.max(0,nA-a*t),fB=Math.max(0,nB-b*t),fC=c*t;
  const mx=Math.max(1,nA,nB,fC);
  const base=158,top=38,bw=54,gap=34;
  let s=`<line x1="44" y1="${base}" x2="330" y2="${base}" class="vz-axis"/>`;
  const items=[["A",fA],["B",fB],["C",fC]];
  items.forEach((it,i)=>{
    const x=56+i*(bw+gap);
    s+=`<rect x="${x}" y="${top}" width="${bw}" height="${base-top}" fill="none" stroke="var(--line)"/>`;
    if(phase==="c"&&it[1]>0){
      const h=(base-top)*it[1]/mx;
      s+=`<rect x="${x}" y="${(base-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" fill="var(--accent-soft)" stroke="var(--accent)"/>`;
      s+=`<text x="${x+bw/2}" y="${(base-h-6).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">${it[1]}</text>`;
    }
    s+=`<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" class="vz-lbl">${it[0]}</text>`;
  });
  if(phase==="c"&&spec.limitant){
    const i=spec.limitant==="B"?1:(spec.limitant==="C"?2:0);
    const x=56+i*(bw+gap);
    s+=`<text x="${x+bw/2}" y="${top-8}" text-anchor="middle" class="vz-lbl-ans">limitant</text>`;
  }
  return vzWrap(s,"État final de la réaction"+(phase==="c"?" quantités restantes":" — emplacements A, B, C"));
}
/* ---------- PC (cinet) : décroissance — n₀, ligne 5 %, point t(95 %) en correction ---------- */
function vzKin(spec,phase){
  const n0=Math.max(0.1,spec.n0||1),t95=Math.max(0.5,spec.t95||4);

/* ---------- PC (ondes) : onde sinusoïdale.
   q : forme d'onde seule (neutre, aucun nombre) ;
   c : + amplitude A et longueur d'onde λ d'une période. */
function vzOnde(spec,phase){
  const n=Math.max(1,Math.min(4,spec.n||2));
  const mid=105,amp=40,x0=60,x1=320,N=140;
  let d="M "+x0+" "+mid;

  s+=`<path d="${d}" pathLength="1" class="vz-curve"/>`;

    s+=`<line x1="${xa}" y1="${mid-amp-16}" x2="${xb.toFixed(1)}" y2="${mid-amp-16}" class="vz-ans"/>`;
    s+=`<line x1="${xa}" y1="${mid-amp-22}" x2="${xa}" y2="${mid-amp-10}" class="vz-ans"/>`;

/* ---------- PC (ondes) : lentille mince convergente (géométrie exacte,

function vzLent(spec,phase){

  s+=`<line x1="${lx}" y1="${ax-58}" x2="${lx}" y2="${ax+58}" class="vz-ray"/>`;
  s+=`<path d="M ${lx-5} ${ax-58} L ${lx} ${ax-66} L ${lx+5} ${ax-58} Z" fill="var(--muted)"/>`;
  s+=`<path d="M ${lx-5} ${ax+58} L ${lx} ${ax+66} L ${lx+5} ${ax+58} Z" fill="var(--muted)"/>`;
  s+=`<line x1="${xo.toFixed(1)}" y1="${ax}" x2="${xo.toFixed(1)}" y2="${ax-h0}" class="vz-ray"/>`;
  s+=`<path d="M ${(xo-5).toFixed(1)} ${ax-h0} L ${xo.toFixed(1)} ${ax-h0-8} L ${(xo+5).toFixed(1)} ${ax-h0} Z" fill="var(--ink)"/>`;
