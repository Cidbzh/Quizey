    s+=`<line x1="${lx}" y1="${ax-h0}" x2="${xi.toFixed(1)}" y2="${(ax+hi).toFixed(1)}" class="vz-leg"/>`;
    s+=`<line x1="${xo.toFixed(1)}" y1="${ax-h0}" x2="${xi.toFixed(1)}" y2="${(ax+hi).toFixed(1)}" class="vz-leg"/>`;
    s+=`<circle cx="${xf.toFixed(1)}" cy="${ax}" r="4.5" class="vz-anspt"/>`;
    s+=`<text x="${xf.toFixed(1)}" y="${ax+18}" text-anchor="middle" class="vz-lbl-ans">F′</text>`;
    s+=`<line x1="${xi.toFixed(1)}" y1="${ax}" x2="${xi.toFixed(1)}" y2="${(ax+hi).toFixed(1)}" class="vz-ans"/>`;
    s+=`<path d="M ${(xi-5).toFixed(1)} ${(ax+hi-8).toFixed(1)} L ${xi.toFixed(1)} ${(ax+hi).toFixed(1)} L ${(xi+5).toFixed(1)} ${(ax+hi-8).toFixed(1)} Z" fill="var(--good)"/>`;
    s+=`<text x="${xo.toFixed(1)}" y="${ax-h0-12}" text-anchor="middle" class="vz-lbl">A</text>`;
    s+=`<text x="${xi.toFixed(1)}" y="${(ax+hi+16).toFixed(1)}" text-anchor="middle" class="vz-lbl-ans">A′</text>`;
  }
  return vzWrap(s,"Lentille mince convergente"+(phase==="c"?" — rayons, foyer F′, image A′":" — axe, lentille, objet"));
}

/* ---------- Point d'entrée unique ----------
   phase "q" (question) ou "c" (correction). Renvoie "" si pas de visuel
   ou si celui-ci ne doit pas s'afficher (ex : "var" en question).
   Un visuel cassé renvoie "" — il ne doit JAMAIS faire planter la
   correction ni la question. */
function VIZdraw(spec,phase){
  if(!spec)return"";
  try{
    if(spec.kind==="var"&&phase==="q")return"";
    switch(spec.kind){
      case"tan": return vzTan(spec,phase);
      case"par": return vzPar(spec,phase);
      case"unit":return vzUnit(spec,phase);
      case"var": return vzVar(spec);
      case"scale":return vzRatio(spec,phase);
      case"proj":return vzProj(spec,phase);
      case"force":return vzForce(spec,phase);
      case"bars":return vzBars(spec,phase);
      case"soln":return vzSoln(spec,phase);
      case"stoich":return vzStoich(spec,phase);
      case"kin":return vzKin(spec,phase);
      case"onde":return vzOnde(spec,phase);
      case"lentille":return vzLent(spec,phase);
      case"circuit":return vzCircuit(spec,phase);
      case"charges":return vzCharges(spec,phase);
      case"work":return vzWork(spec,phase);
      case"markov":return vzMarkov(spec,phase);
    }
  }catch(e){/* silencieux : le texte de la méthode reste l'essentiel */}
  return"";
}

/* Clé de dédup de la liste à réviser — définie AVANT loadStats, dont la migration
   de dédoublonnage ci-dessous a besoin (un const n'existe qu'après sa déclaration).

   même question pédagogique plusieurs entrées — et une bonne réponse ne la
   retirerait presque jamais (l'ordre des options a changé depuis l'ajout). Donc,

   bonne réponse (jamais l'ordre ni l'index). Autres types : le JSON complet
   suffit (les nombres définissent la question). — 2026-08-22, évaluation
   qualitative ; remontée ici le même jour (migration des doublons hérités). */
const qKey=q=>(q&&q.type==="choice"&&q.options)?JSON.stringify({t:q.type,p:q.prompt,o:q.options.slice().sort(),c:q.options[q.correct]}):JSON.stringify(q);
function loadStats(key){
  const st=store.get(key,{ans:0,good:0,bestStreak:0,bestSprint:0,bySub:{}});
  if(st.bySub===undefined)st.bySub={};           /* id -> {ans,good} — créé à la volée par subStat, mais indispensable au rendu */
  if(st.skips===undefined)st.skips=0;
  if(st.streakBySub===undefined)st.streakBySub={};   /* id -> meilleure série par thème */
  if(st.history===undefined)st.history=[];            /* [{s,l,o}] — 100 dernières réponses */
  if(st.review===undefined)st.review=[];              /* [{s,l,q,reps,due}] — liste à réviser (max 50) + répétition espacée */
  /* Migration v3 : échéance (due, ms) + compteur de réussites d'affilée (reps).
     Les anciens items (sans ces champs) → dus immédiatement ; idempotent. */
  st.review.forEach(it=>{if(it.reps===undefined)it.reps=0;if(it.due===undefined)it.due=0;});
  if(st.respTimes===undefined)st.respTimes=[];        /* [s] — temps de réponse récents (mode libre) → estimation « ≈ N min » */
  if(st.respTimes.length>30)st.respTimes=st.respTimes.slice(-30);
  /* Orphelines : une question à réviser ou une entrée d'historique rattachée à un thème
     supprimé du registre (ex. « cosmo », retiré de PC) plantait renderQ (r.sub.name) et
     cassait « S'entraîner » (point faible inexistant). Purgées au chargement — idempotent.
     bySub/streakBySub orphelins : inoffensifs (jamais rendus), conservés. */
  st.review=st.review.filter(it=>THEME_BY_ID[it.s]);
  /* Doublons hérités (2026-08-22, bug signalé) : AVANT la clé qKey stable, la même
     question pouvait entrer la liste PLUSIEURS FOIS (les options des QCM sont
     mélangées à chaque tirage). En révision, une bonne réponse ne faisait
     progresser qu'UNE entrée → la question revenait « plusieurs fois d'affilée ».
     On dédup au chargement, en gardant l'entrée la plus avancée (reps max =
     progression espacée préservée). Idempotent. */
  {
    const keep={};
    for(const it of st.review){const k=qKey(it.q);if(!keep[k]||it.reps>keep[k].reps)keep[k]=it;}
    st.review=Object.values(keep);
  }
  st.history=st.history.filter(it=>THEME_BY_ID[it.s]);
  return st;
}
const activeStatsKey=()=>state.matiere==="de"?"qz_stats_de":state.matiere==="en"?"qz_stats_en":state.matiere==="pc"?"qz_stats_pc":"qz_stats";
let stats=loadStats(activeStatsKey());
state.annee=readYear(state.matiere); /* DE/EN → null ; maths/PC → « premiere » par défaut */
state.experte=store.get("qz_experte_math",false)===true; /* option « Expertes » (maths × Terminale) ; la migration « experte »→terminale dans readYear a déjà écrit true le cas échéant */
const homeEl=$("#home"),playEl=$("#play"),qbox=$("#qbox");
const save=()=>store.set(activeStatsKey(),stats);
const subStat=id=>stats.bySub[id]||(stats.bySub[id]={ans:0,good:0});
/* ---- v2 : historique glissant + liste de révision ---- */
function pushHistory(s,l,o){stats.history.push({s,l,o});if(stats.history.length>100)stats.history=stats.history.slice(-100);}
/* Répétition espacée : échéance « due » (timestamp ms) qui s'éloigne à chaque
   réussite d'affilée, revient à une courte échéance en cas d'erreur.
   reps 0 = dû maintenant, puis 1 j / 3 j / 7 j / 15 j ; 5 réussites d'affilée
   = ACQUISE → l'item quitte la liste. */
const DAY=86400000;
const REVIEW_LADDER=[0,DAY,3*DAY,7*DAY,15*DAY];
const REVIEW_GRADUATE=5;
function reviewAdd(sub,lvl,q){const k=qKey(q);if(!stats.review.some(r=>qKey(r.q)===k)){stats.review.push({s:sub,l:lvl,q,reps:0,due:0});if(stats.review.length>50)stats.review.shift();}}
function reviewRemove(q){const k=qKey(q);const i=stats.review.findIndex(r=>qKey(r.q)===k);if(i>=0)stats.review.splice(i,1);}
function reviewRequeue(q){const k=qKey(q);const i=stats.review.findIndex(r=>qKey(r.q)===k);if(i>=0){const it=stats.review.splice(i,1)[0];stats.review.push(it);}}
function reviewDue(){return stats.review.filter(it=>it.due<=Date.now());}
function reviewDueCount(){return reviewDue().length;}
/* Bonne réponse en révision → la prochaine échéance s'éloigne (sortie de la
   liste dès REVIEW_GRADUATE réussites d'affilée). */
function reviewAdvance(q){
  const k=qKey(q);const it=stats.review.find(r=>qKey(r.q)===k);
  if(!it)return;
  it.reps+=1;
  if(it.reps>=REVIEW_GRADUATE){reviewRemove(q);return;}
  it.due=Date.now()+REVIEW_LADDER[Math.min(it.reps,REVIEW_LADDER.length-1)];
}
/* Mauvaise réponse en révision → courte échéance (1 j) : on la revoit vite,
   mais on n'est plus bloqué à la relouer dans la même séance. */
function reviewReset(q){
  const k=qKey(q);const it=stats.review.find(r=>qKey(r.q)===k);
  if(!it)return;
  it.reps=0;it.due=Date.now()+REVIEW_LADDER[1];
}
/* Points faibles : top 5 cellules thème×niveau les moins précises,
   calculées sur les 50 DERNIÈRES réponses (2026-08-24, Cid : fenêtre élargie
   des 10 aux 50 dernières — le moment présent, avec un peu plus de matière),
   min. 3 réponses/cellule. `history` garde ses 100 entrées ; seul le calcul
   regarde les 50 dernières. */
function weakPoints(){
  const agg={};
  for(const h of (stats.history||[]).slice(-50)){const k=h.s+":"+h.l;(agg[k]=agg[k]||{ans:0,good:0}).ans++;if(h.o)agg[k].good++;}
  const out=[];
  for(const k in agg){if(agg[k].ans>=3){const i=k.indexOf(":");out.push({s:k.slice(0,i),l:k.slice(i+1),ans:agg[k].ans,acc:agg[k].good/agg[k].ans});}}
  out.sort((a,b)=>a.acc-b.acc||b.ans-a.ans);
  return out.slice(0,5);
}
/* Favicon : le « Q à la plume » (source : logo.svg) en data: URI — l'app reste
   fichier unique. La plume suit l'accent de la matière (bleu maths / violet PC
   / vert allemand) ; l'anneau reste en encre. Défensif : sans <link>, le
   favicon statique de tête est conservé tel quel. */
function setFavicon(){
  try{
    const pen={maths:"#2563EB",pc:"#7C3AED",de:"#047857",en:"#DC2626"}[state.matiere]||"#2563EB";
    const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="28" r="19" stroke="#16233D" stroke-width="7"/><path d="M23 33 C31 44, 45 47, 55 35" stroke="'+pen+'" stroke-width="7"/></g></svg>';
    const l=document.querySelector('link[rel="icon"]');
    if(l)l.href="data:image/svg+xml,"+encodeURIComponent(svg);
  }catch(e){}
}
/* Bascule de matière : persiste le choix, échange la variable stats
   (une seule variable — tout le moteur passe déjà par stats),
   réinitialise la tuile sélectionnée et re-rend l'accueil. */
function setMatiere(m){
  if(state.matiere===m)return;
  state.matiere=m;
  state.annee=readYear(m); /* chaque matière garde son année (DE/EN → null) */
  store.set(SUBJECT_KEY,m);
  stats=loadStats(activeStatsKey()); /* une seule variable échangée — tout passe déjà par stats */
  state.sel=[];                      /* réinitialise la sélection de chapitres (vide = mix) */
  /* Accent matière (violet PC / vert DE / rouge EN) : data-mat sur <html> → variables d'accent. La bascule est
     IMMÉDIATE, sans temps mort : le swap et la cascade démarrent au clic, la
     cascade masquant elle-même le changement de contenu (titre, slogan et
     [data-rv] repartent de leur état initial dans la même frame). .theming
     couvre les couleurs d'accent restantes (eyebrow, « tu sais. »,
     noms de chapitre) pendant la transition couleur. Sous
     prefers-reduced-motion : idem, et la cascade est neutralisée par les
     règles CSS globales. */
  const r=document.documentElement;
  if(m==="pc")r.setAttribute("data-mat","pc");else if(m==="de")r.setAttribute("data-mat","de");else if(m==="en")r.setAttribute("data-mat","en");else r.removeAttribute("data-mat");
  setFavicon(); /* la plume du Q suit l'accent de la matière */
  r.classList.add("theming");
  clearTimeout(setMatiere._t);
  setMatiere._t=setTimeout(function(){r.classList.remove("theming");},520);
  syncXopt(); /* case « Maths expertes » : visible seulement maths × Terminale (espace réservé en maths) */
  renderHome();
  /* Rejoue la cascade d'arrivée (html.boot) sur le DOM fraîchement rendu,
     en mode rapide (délais × .45) : le premier mouvement part quasi
     immédiatement après le clic, sans temps mort. Passe par rearmBoot(true) :
     un SEUL cycle de vie classe+timer partagé, la bascule en cours annule la
     cascade et le timer précédent → seule la DERNIÈRE animation survit,
     quelle que soit la cadence des bascules. */
  rearmBoot(true);
}

function renderHome(){
  /* Re-rendu « simple » (niveau, tuile thème, retour accueil) : ne jamais
     rejouer la cascade d'arrivée. Si html.boot est encore active (fenêtre de
     2,8 s qui suit une bascule de matière), les nouveaux nœuds [data-rv]
     repartiraient en animation et le timer en cours pourrait retirer la classe
     en plein vol → l'« animation à moitié ». On désarme classe + timer : un
     simple re-rendu ne peut plus rejouer ni interrompre la cascade. Les deux
     chemins volontaires (première visite, bascule matière) ré-armed via
     rearmBoot() APRÈS le rendu. */
  clearTimeout(rearmBoot._t);
  document.documentElement.classList.remove("boot");
  const M=MAT_DATA[state.matiere];
  $("#heroLede").innerHTML=M.lede;   /* phrase de base, identique quelle que soit l'année */

  syncXopt(); /* case « Maths expertes » : visible seulement maths × Terminale (espace réservé en maths) */
  document.querySelectorAll(".seg-btn[data-year]").forEach(x=>x.classList.toggle("on",x.dataset.year===state.annee));
  renderLvlCard();
  document.querySelectorAll(".seg-btn[data-mat]").forEach(x=>x.classList.toggle("on",x.dataset.mat===state.matiere));
  paintLvlButtons(); /* libellés des niveaux : A2/A2+/B1 en langues, Facile/Moyen/Difficile en maths/PC */
  syncLvlButtons(); /* état « on » des boutons Facile/Moyen/Difficile/Auto */
  const acc=stats.ans?Math.round(100*stats.good/stats.ans):0;
  $("#statGrid").innerHTML=
    `<div class="stat"><div class="v">${stats.ans}</div><div class="k">questions répondues</div></div>`+
    `<div class="stat"><div class="v">${stats.good}</div><div class="k">réponses correctes</div></div>`+
    `<div class="stat"><div class="v">${acc}%</div><div class="k">précision globale</div></div>`+
    `<div class="stat"><div class="v">${stats.bestStreak}</div><div class="k">meilleure série</div></div>`+
    `<div class="stat stat-skips"><div class="v">${stats.skips}</div><div class="k">questions passées</div></div>`;
  const grid=$("#subGrid");
  grid.innerHTML=visibleSubjects().map((s,i)=>{
    const st=stats.bySub[s.id]||{ans:0,good:0};
    let pc=st.ans?Math.round(100*st.good/st.ans)+"% · "+st.ans+" q":"pas encore pratiqué";
    if(st.skips)pc+=" · "+st.skips+" passées";
    return `<button type="button" class="subcard${state.sel.includes(s.id)?" on":""}" data-sub="${s.id}" style="--cd:${i*60}ms">
      <span class="nm">${s.name}</span>${s.tag?`<span class="subtag">${s.tag}</span>`:""}<span class="pc">${pc}</span></button>`;
  }).join("");
  grid.querySelectorAll(".subcard").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.sub, i=state.sel.indexOf(id);   /* toggle : la sélection est un ensemble */
    if(i>=0)state.sel.splice(i,1);else state.sel.push(id);
    renderHome();
  }));
  /* ---- v2 : « À réviser » (rangée du hero) / « Par thème » (colonne) / points
     faibles (marge) ---- */
  /* « À réviser » : panneau standard .revcta (pas plus voyant que les autres
     blocs — décision 2026-08-21), DANS le hero, sur sa propre ligne sous le
     texte, pleine largeur de la colonne principale. Le slot est un simple
     <div> (vide = display:none, pas de vide parasite) ; son bouton #btnReview
     est câblé ici, le slot étant rempli/vidé à chaque rendu. */
  const revSlot=$("#revSlot");
  if(revSlot){
    const due=reviewDue();                 /* items ÉCHUS aujourd'hui (répétition espacée) */
    const total=stats.review.length;
    if(due.length>0){
      /* 2026-08-22 : cellules « plume » — [titre] | [N dues aujourd'hui] | [≈ N min]
         | [chapitres, MAX 4 noms + « +N autres »] | [+X à venir] | [bouton à droite].
         Un séparateur .revsep (trait de plume vertical, CSS — ≥1280 px) entre
         chaque partie, absent quand la partie l'est (estimation / chapitres /
         à venir). Thèmes distincts des items DUS, ordre de première occurrence,
         résolus par THEME_BY_ID, & échappé (« Log & exp »).
         « ≈ N min » : moyenne des temps de réponse du mode libre (stats.respTimes)
         × nombre de DUS — affichée seulement si ≥ 3 mesures, jamais < 1 min.
         « +X à venir » = le reste de la liste, déjà programmé plus tard. */
      const chapsAll=[...new Set(due.map(r=>THEME_BY_ID[r.s]?THEME_BY_ID[r.s].name:null))].filter(Boolean);
      const chaps=chapsAll.length?chapsAll.slice(0,4).map(n=>n.replace(/&/g,"&amp;")).join(" · ")+
        (chapsAll.length>4?` +${chapsAll.length-4} autre${chapsAll.length>5?"s":""}`:""):"";
      const n=due.length;
      const ahead=total-n;
      const est=(stats.respTimes.length>=3)?Math.max(1,Math.round(stats.respTimes.reduce((a,b)=>a+b,0)/stats.respTimes.length*n/60)):0;
      const sep=`<span class="revsep" aria-hidden="true"></span>`;

        `<section class="panel revcta" aria-labelledby="hRev" data-rv style="--d:1.0s">`+

        (chaps?sep+`<span class="revchaps">${chaps}</span>`:"")+
        (ahead>0?sep+`<span class="revtime">+${ahead} à venir</span>`:"")+
        sep+

        `</section>`;
    }else if(total>0){
      /* Plus rien d'échu aujourd'hui mais la liste n'est pas vide : les items
         sont en cours d'acquisition (programmés plus tard). On le signale,

      revSlot.innerHTML=
        `<section class="panel revcta" aria-labelledby="hRev" data-rv style="--d:1.0s">`+
        `<h2 id="hRev">À réviser</h2>`+

        `</section>`;
    }else{
      revSlot.innerHTML="";
    }
    const br=$("#btnReview");
    if(br)br.addEventListener("click",startReview);
  }
  /* « Par thème » : tableau des résultats par thème, en colonne principale
     sous l'entraînement, en bas de colonne. 2026-08-23 (sur demande) :
     TOUJOURS affiché — même zéro réponse (lignes « 0 · — · — ») : avant, le
     panneau disparaissait dès que l'année active n'avait pas encore de stats
     (les stats vivent par thème, et les ids de thèmes changent avec l'année —
     d'où « ne s'affiche plus » après le chantier lycée). */
  const bySlot=$("#bySubSlot");

        `<div class="substathead"><span>thème</span><span>q</span><span>précision</span><span>série</span></div>`+
        activeSubjects().map(s=>{
          const st=stats.bySub[s.id]||{ans:0,good:0};
          const pct=st.ans?Math.round(100*st.good/st.ans)+"%":"—";
          const stk=stats.streakBySub[s.id]||0;
          return `<div class="substatrow"><b>${s.name}</b><span>${st.ans||0}</span><span>${pct}</span><span>${stk>0?"🔥"+stk:"—"}</span></div>`;
        }).join("")+
      `</section>`;
  }
  /* Points faibles : dans la MARGE (slot #statsExtra dans .margewrap) —
     panneau standard (carton + h2 + trait de plume), comme les autres blocs
     de l'accueil. Slot simple <div>, vide = 0 hauteur. */
  const extra=$("#statsExtra");
  if(extra){
    let html="";
    const weak=weakPoints();
    if(weak.length){
      html+=`<section class="panel" aria-labelledby="hWeak" data-rv style="--d:1.42s">`+
        `<h2 id="hWeak">Tes points faibles</h2>`+
        `<p class="muted" style="margin:0 0 6px">Les thèmes qui résistent le plus, sur tes 50 dernières réponses.</p>`+
        weak.map(w=>{
          const nm=THEME_BY_ID[w.s];const pct=Math.round(100*w.acc);
          return `<div class="weakrow">`+
            `<div class="weakline"><span class="weaknm">${nm?nm.name:w.s}<small>${lvlLabel(w.l)}</small></span>`+
            `<span class="weakpct" style="color:${pct<60?"var(--bad)":"var(--accent)"}">${pct}%</span></div>`+
            `<div class="weakline"><span class="weakbar"><i style="width:${Math.max(6,Math.min(100,pct))}%"></i></span>`+
            `<button type="button" class="btn btn-primary small" data-weak="${w.s}:${w.l}">S'entraîner →</button></div>`+
            `</div>`;
        }).join("")+
        `</section>`;
    }
    /* Aucun point faible = slot vide (0 hauteur) : la marge n'affiche plus
       qu'un blanc — le bloc apparaît d'office après les premiers entraînements. */
    extra.innerHTML=html;
    extra.querySelectorAll("[data-weak]").forEach(b=>b.addEventListener("click",()=>{
      const p=b.dataset.weak.split(":");trainWeak(p[0],p[1]);
    }));
  }
  /* Marge alignée sur la carte « Niveau » — voir la règle .margewrap (CSS). */
  liftMarge();
}
function liftMarge(){
  /* --revlift = distance du HAUT de la carte « Niveau » au bas de la rangée
     du hero + gap de rangée 16 px : la carte est le PREMIER bloc après le
     texte (ordre 2026-08-22 : Niveau → Stats → À réviser), donc Stats et
     « À réviser » + leurs gaps sont tous compris — et « Tes points faibles »
     s'aligne sur le HAUT de la carte. Si « À réviser » est vide (display:none)
     sa hauteur tombe d'elle-même dans la mesure. Mesurée sur le DOM réel :
     renderHome est le seul créateur / destructeur → aucun écouteur resize
     nécessaire. */
  const hero=document.querySelector("#home .hero");
  const card=hero?hero.querySelector(".lvcard"):null;
  let h=0;
  if(hero&&card){
    const hb=hero.getBoundingClientRect().bottom;
    const ct=card.getBoundingClientRect().top;
    h=Math.max(0,Math.round(hb-ct)+16);
  }
  $("#home").style.setProperty("--revlift",h+"px");
}

  t.classList.remove("screen-in");void t.offsetWidth;t.classList.add("screen-in");
}
function goHome(){
  state.mode=null;
  showPlay(false);
  renderHome();
}
/* S'entraîner sur un point faible : verrouille thème + niveau puis lance le mode libre.
   Garde legacy : les cellules history héritées peuvent porter l'ancienne
   difficulté "experte" (supprimée le 2026-08-23 — « expertes » est devenu
   une case à cocher de Terminale maths, pas un niveau) → on ramène sur
   "auto", jamais un niveau orphelin qui casserait pickQ. */
function trainWeak(s,l){
  const lv=(l==="facile"||l==="moyen"||l==="difficile")?l:"auto";
  state.level=lv;
  state.sel=[s];                      /* verrouille ce thème (multi-sélection d'un seul) */
  document.querySelectorAll(".seg-btn[data-lvl]").forEach(x=>x.classList.toggle("on",x.dataset.lvl===lv));
  startFree();
}

/* Niveau « Auto » : quel niveau servir pour un thème, selon ses 8 dernières
   réponses (stats.history). ≥80 % → difficile, 50–80 % → moyen, <50 % → facile ;
   moins de 3 réponses → moyen (on ne devine pas une performance qu'on n'a pas). */
function autoLevel(id){
  const H=stats.history.filter(h=>h.s===id).slice(-8);
  if(H.length<3)return "moyen";
  const good=H.reduce((a,h)=>a+(h.o?1:0),0);
  const acc=good/H.length;
  if(acc>=0.8)return "difficile";
  if(acc>=0.5)return "moyen";
  return "facile";
}
/* ---------- Questions ---------- */
/* Anti-répétition (shuffle-bag) : la poche contient toutes les questions
   disponibles pour le tirage courant — chaque thème (visible, ou verrouillé)
   × niveau cible — et on sert chaque question UNE fois avant de re-mélanger.
   En « mix » on parcourt TOUS les thèmes avant toute répétition ; verrouillé
   sur un thème, on ne sert que ce thème (1 question/niveau → on le re-drille).
   Poche EN MÉMOIRE (jamais persistée) ; la clé suit l'état (matière/année/
   thème/niveau) → tout changement ré-initialise la poche. Review hors poche
   (item ÉCHU). */
const genBag={};   /* clé état -> [paires [sub, indexGen] restants, mélangés] */
function bagKey(){
  /* + l'option « Expertes » (ne change le pool qu'en maths × Terminale) →
     toute variation ré-ouvre une poche fraîche (8 ↔ 11 thèmes). */
  return [state.matiere,state.annee,state.sel.join(","),state.level==="auto"?"auto":state.level,(state.matiere==="maths"&&state.annee==="terminale"&&state.experte)?"x":""].join("|");
}
function bagDraw(){
  const key=bagKey();
  let bag=genBag[key];
  if(!bag||!bag.length){
    const vis=visibleSubjects();
    let scope=state.sel.length?vis.filter(s=>state.sel.includes(s.id)):vis;   /* sélection vide = mix */
    if(!scope.length)scope=vis;            /* sélection orpheline (année/matière changée) → tous les visibles */
    const pool=[];
    for(const sub of scope){
      const t=state.level==="auto"?autoLevel(sub.id):state.level;   /* Auto : niveau adapté au thème */
      let idx=[];
      sub.gens.forEach((g,i)=>{if(!t||g.lvl===t)idx.push(i);});
      if(!idx.length)sub.gens.forEach((g,i)=>idx.push(i));   /* repli : aucun au niveau → tous */
      for(const i of idx)pool.push([sub,i]);
    }
    bag=shuf(pool);genBag[key]=bag;        /* poche vide → remélange des questions dispo */
  }
  const pair=bag.shift();
  return{sub:pair[0],gen:pair[0].gens[pair[1]]};
}
function pickQ(){
  if(state.mode==="review"){
    const item=reviewDue()[0];              /* premier item ÉCHU (répétition espacée) */
    if(!item)return null;
    return{q:item.q,sub:THEME_BY_ID[item.s],lvl:item.l};
  }
  const d=bagDraw();
  const q=d.gen.make();
  return{q,sub:d.sub,lvl:d.gen.lvl};   /* vrai niveau de la QUESTION (gen.lvl) */
}
function renderQ(){
  state.answered=false;
  state.qT0=performance.now();   /* horodatage de l'affichage — chronomètre SILENCIEUX (sert à estimer le temps de révision, jamais affiché pendant la partie) */
  let r;
  if(state.mode==="review"){
    r=pickQ();
    if(!r){endReview();return;}
  }else if(state.skipQueue.length){r=state.skipQueue.shift();r.q._passed=true;}
  else r=pickQ();
  state.q=r.q;state.sub=r.sub;state.curLvl=r.lvl||state.level;
  const q=state.q;
  $("#chipSub").textContent=r.sub.name;
  /* 2026-08-24 (Cid) : l'ANNÉE, en plus du chapitre et de la difficulté.
     Année du thème (THEME_YEAR) — pas l'année sélectionnée sur l'accueil —
     pour rester juste en révision (question d'une autre année). DE/EN :
     pas d'entrée → puce masquée. */
  const yv=THEME_YEAR[r.sub.id];
  if(yv){const cy=$("#chipYear");cy.textContent={seconde:"Seconde",premiere:"Première",terminale:"Terminale"}[yv];cy.hidden=false;}
  else $("#chipYear").hidden=true;
  $("#chipLvl").textContent=lvlLabel(state.curLvl||state.level);
  paintChipNiv();   /* le niveau de la matière, en libre comme en révision */
  /* 2026-08-22 : en révision, le compteur = questions ÉCHUES (reviewDue()) —
     c'est tout ce que la session sert (pickQ prend reviewDue()[0]). L'ancienne
     valeur (stats.review.length, max 50) affichait aussi les replanifiées. */
  $("#qCount").textContent=state.mode==="review"?reviewDue().length+" restant(s)":"question "+(state.n+1);
  const eyebrow=state.mode==="review"?"Révision — tes questions à reprendre":r.sub.name+" · niveau "+lvlLabel(state.curLvl||state.level)+(state.level==="auto"?" (auto)":"");
  /* Visuel de question : image NEUTRE (courbe/axes sans nombres, pas de
     tangente, pas de racines) — elle aide à visualiser sans donner la réponse.
     Certaines questions n'en ont pas (var, QCM colinéarité…) : c'est voulu. */
  const vzq=q.viz?VIZdraw(q.viz,"q"):"";
  let inner=`<div class="qcard"><p class="qeyebrow">${eyebrow}</p>`+
    `<p class="prompt">${q.prompt}</p>`+
    (vzq?`<div class="viz">${vzq}</div>`:"");
  if(q.type==="choice"){
    inner+=`<div class="opts">`+q.options.map((o,i)=>`<button type="button" class="opt" data-i="${i}">${o}</button>`).join("")+`</div>`+
      `<div style="margin-top:10px"><button type="button" class="btn btn-ghost small" id="passBtn">Passer cette question →</button></div>`;
  }else{
    /* aria-label (2026-08-22) : le champ n'a pas de <label> visible — on le
       nomme quand même pour les lecteurs d'écran. */
    /* 2026-08-25 (Cid) : inputmode TOUJOURS « text » — le clavier COMPLET
       d'iOS/Android apparaît dans TOUTES les questions, JAMAIS le pavé
       nombres-seuls (« decimal » n'a même pas de touche « / » : impossible de
       taper 3/4, et Cid ne veut le pavé nombres seul dans AUCUN cas).
       checkAnswer accepte « . » et « , » de toute façon. Ne pas remettre
       « decimal ». */
    inner+=`<div class="ans"><input id="ansIn" type="text" inputmode="text" autocomplete="off" aria-label="Ta réponse" placeholder="${q.type==="frac"?"ex : 3/5 ou 0,6":"ta réponse"}">`+
      `<button class="btn btn-primary" id="ansBtn">Valider</button>`+
      `<button class="btn btn-ghost" id="passBtn">Passer →</button>`+
      `<span class="hint">${q.type==="frac"?"Réponds en fraction (a/b) ou en décimal — les deux sont acceptés.":"Entier ou décimal, virgule acceptée."} · Échap = passer</span></div>`;
  }
  /* aria-live (2026-08-22) : la correction arrive dans #fb APRÈS sa création —
     la zone existe donc avant le contenu, et les lecteurs d'écran l'annoncent
     (aprèsAnswer / revealAfterSkip / reviewSkip y écrivent tous les trois). */
  inner+=`<div id="fb" aria-live="polite"></div></div>`;
  qbox.innerHTML=inner;
  const inp=$("#ansIn");
  if(inp){
    inp.focus();
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  }
  const btn=$("#ansBtn");
  if(btn)btn.addEventListener("click",submit);
  const pb=$("#passBtn");
  if(pb)pb.addEventListener("click",passQ);
  qbox.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answerChoice(+b.dataset.i,b)));
}

/* ---------- Vérification ---------- */
function checkAnswer(q,raw){
  const s=String(raw).trim();
  if(s===""||s===".")return null;
  if(q.type==="frac"){
    if(s.includes("/")){
      const p=s.split("/").map(Number);
      if(p.length!==2||!isFinite(p[0])||!isFinite(p[1])||p[1]===0)return null;
      const a=fr(p[0],p[1]),b=fr(q.answer.n,q.answer.d);
      return a.n===b.n&&a.d===b.d;
    }
    const v=Number(s.replace(",","."));
    if(!isFinite(v))return null;
    return Math.abs(v-q.answer.n/q.answer.d)<1e-9;
  }
  const v=Number(s.replace(",","."));
  if(!isFinite(v))return null;
  const tol=(q.tol!==undefined?q.tol:1e-4)*Math.max(1,Math.abs(q.answer));
  return Math.abs(v-q.answer)<=tol;
}
function fmtAns(q){
  if(q.type==="frac")return fs(q.answer.n,q.answer.d);
  if(q.tol!==undefined)return (Math.round(q.answer*100)/100).toString().replace(".",",");
  return String(q.answer);
}

/* ---------- Réponse ---------- */
/* Visuel « réponse » de la correction (tangente, racines, triangle, flèches).
   Un défaut du visuel ne doit JAMAIS empêcher l'affichage de la méthode. */
const vizAns=q=>{try{const v=q&&q.viz?VIZdraw(q.viz,"c"):"";return v?`<div class="viz viz-ans">${v}</div>`:"";}catch(e){return"";}};
function answerChoice(i,btn){
  if(state.answered)return;
  state.answered=true;
  const q=state.q,ok=i===q.correct;
  qbox.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  qbox.querySelectorAll(".opt")[q.correct].classList.add("right");
  if(!ok)btn.classList.add("wrong");
  afterAnswer(ok,q,ok?"":"La bonne réponse était : <b>"+q.options[q.correct]+"</b>. ");
}
function submit(){
  if(state.answered)return;
  const inp=$("#ansIn");
  const res=checkAnswer(state.q,inp.value);
  if(res===null){
    inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");inp.focus();
    return;
  }
  state.answered=true;
  afterAnswer(res,state.q,res?"":"La bonne réponse était : <b>"+fmtAns(state.q)+"</b>. ");
}
/* ================= NIVEAU QUIZEY — XP PAR MATIÈRE (demande Cid 2026-08-22) =================
   Chaque matière a SON niveau : XP = les points gagnés sur bonne réponse
   (hook dans afterAnswer), comptée dans les trois modes, × le coefficient
   matière XP_MULT (2026-08-24, Cid : maths/PC — questions plus longues à
   répondre — → ×1.5, langues ×1.2) + bonus REVIEW_BONUS à la fin d'une
   session « À réviser » (endReview). Pas d'XP sur « Passer »
   (passQ ne passe PAS par afterAnswer) ni sur mauvaise réponse. Le NIVEAU est
   DÉDUIT de l'XP (jamais stocké) ; seule l'XP persiste — UNE CLÉ PAR MATIÈRE,
   même convention que les stats : qz_xp (maths) / qz_xp_pc / qz_xp_de /
   qz_xp_en (défaut 0, aucun plafond, aucun déblocage de contenu). La carte est
   re-rendue à chaque bascule de matière (renderHome). Courbe (2026-08-24,
   Cid : l'ancien coût 50·n par niveau ralentissait trop vite — il voulait
   « une petite différence tous les 10 niveaux seulement ») : coût CONSTANT
   de 100 XP par palier dans chaque bloc de 10 niveaux, +25 XP à chaque
   palier de 10 — xpCum(1)=0, xpCum(2)=100, xpCum(11)=1000, xpCum(12)=1125,
   xpCum(21)=2250, xpCum(22)=2400, xpCum(31)=3750, xpCum(51)=7500. */
function xpCum(n){   /* XP pour ATTEINDRE le niveau n — forme close : m=n−1,
   q=blocs de 10 terminés (coût 100,125,150…), r=reste du bloc courant. */
  if(n<=1)return 0;
  const m=n-1,q=Math.floor(m/10),r=m%10;
  return 1000*q+125*q*(q-1)+r*(100+25*q);
}
function levelOf(xp){   /* inverse de xpCum — le coût étant constant par bloc,
   on parcourt les blocs de 10 au lieu d'isoler une racine. */
  if(xp<=0)return 1;
  let left=xp,n=1;
  for(let q=0;;q++){
    const per=100+25*q,block=10*per;
    if(left>=block){left-=block;n+=10;continue;}
    return n+Math.floor(left/per);
  }
}
function lvlInfo(x){const n=levelOf(x),lo=xpCum(n),hi=xpCum(n+1);return{n,pct:(x-lo)/(hi-lo)};}
function xpKey(){return state.matiere==="maths"?"qz_xp":"qz_xp_"+state.matiere;}
function getXP(){const v=store.get(xpKey(),0);return typeof v==="number"&&isFinite(v)&&v>=0?v:0;}
/* (2026-08-24, Cid) Coefficient XP PAR MATIÈRE : maths et physique-chimie
   portent des questions plus longues à répondre → elles rapportent PLUS d'XP
   par bonne réponse que les langues (qui elles aussi progressent un peu plus
   vite qu'avant). Appliqué à TOUS les gains — bonne réponse (2 modes) et
   bonus de fin de révision — au même endroit, dans gainXp(). Le SCORE de
   séance (state.score, chip « score ») reste les points bruts 5/10/15 + série. */
const XP_MULT={maths:1.5,pc:1.5,de:1.2,en:1.2};
function gainXp(pts){
  pts=Math.max(1,Math.round(pts*(XP_MULT[state.matiere]||1)));
  const k=xpKey(),x=getXP(),before=levelOf(x);
  store.set(k,x+pts);renderLvlCard();paintChipNiv();
  if(levelOf(x+pts)>before)levelUp(before,levelOf(x+pts));
  return pts;   /* valeur RÉELLEMENT créditée (après coefficient) — sert à l'affichage */
}
/* Puce « Niv. N » de la barre d'écran de question (2026-08-22, sur demande) :
   le niveau de la MATIÈRE (le « Niveau N » de la carte du hero) reste visible
   pendant la partie — les trois modes, et la puce suit les paliers franchis en
   cours de séance (gainXp). Garde-fou `if(el)` : l'écran de question n'est pas
   toujours dans le DOM rendu. */
/* 2026-08-23 (sur demande) : « Niv. N » + BARRE de progression vers le palier
   suivant (même % que la carte du hero — lvlInfo.pct). Le barreur est un <span>
   SANS texte : textContent reste « Niv. N » (lisible par test et lecteurs
   d'écran), seule la barre est visuelle. */
function paintChipNiv(){const el=$("#chipNiv");if(!el)return;const info=lvlInfo(getXP());el.innerHTML="Niv. "+info.n+'<span class="nlvlbar" aria-hidden="true"><i style="width:'+(info.pct*100).toFixed(1)+'%"></i></span>';}
/* Points par bonne réponse selon la DIFFICULTÉ de la question : facile 5 ·
   moyen 10 · difficile 15. On lit le niveau de la QUESTION (state.curLvl),
   pas le réglage global. + bonus de série de 5 dès la 3ᵉ bonne d'affilée.
   La clé "experte" (20) est LEGACY : plus aucune question ne porte ce niveau
   (supprimé le 2026-08-23 — « expertes » est devenu une case à cocher de
   Terminale maths, pas un niveau) — elle sert seulement au scoring des
   lignes history héritées. */
const PTS_LVL={facile:5,moyen:10,difficile:15,experte:20};
/* (2026-08-24, Cid) Bonus de FIN DE SESSION « À réviser » (endReview) :
   base fixe créditée en une seule fois, multipliée par le coefficient
   matière dans gainXp (maths/PC → +45, DE/EN → +36). La carte de fin
   affiche la valeur réellement créditée. */
const REVIEW_BONUS=30;
function afterAnswer(ok,q,extra){
  let pts=0;
  if(ok){state.streak++;const base=PTS_LVL[state.curLvl]!==undefined?PTS_LVL[state.curLvl]:10;pts=base+(state.streak>=3?5:0);state.score+=pts;state.good++;stats.good++;gainXp(pts);}
  else state.streak=0;
  state.maxStreak=Math.max(state.maxStreak,state.streak);
  state.n++;stats.ans++;
  const st=subStat(state.sub.id);st.ans++;if(ok)st.good++;
  stats.bestStreak=Math.max(stats.bestStreak,state.streak);
  /* v2 : série par thème, historique glissant, liste de révision */
  const lvl=state.curLvl||state.level;
  /* Chrono silencieux (2026-08-21) : temps de réponse du mode LIBRE uniquement,
     30 derniers conservés, pour estimer « ≈ N min » sur la carte À réviser —
     jamais affiché pendant la partie. Garde-fou 0,5 s–1 h : exclut les artefacts
     (DOM de test, onglet inactif) et les valeurs absurdes. */
  if(state.mode==="free"&&state.qT0){const dt=(performance.now()-state.qT0)/1000;if(dt>0.5&&dt<3600){stats.respTimes.push(dt);if(stats.respTimes.length>30)stats.respTimes=stats.respTimes.slice(-30);}}
  stats.streakBySub[state.sub.id]=Math.max(stats.streakBySub[state.sub.id]||0,state.streak);
  pushHistory(state.sub.id,lvl,ok?1:0);
  if(ok){if(state.mode==="review")reviewAdvance(q);else reviewRemove(q);}
  else if(state.mode==="review")reviewReset(q);
  else reviewAdd(state.sub.id,lvl,q);
  save();
  $("#tScore").textContent=state.score;
  $("#tStreak").textContent=state.streak;
  /* Feedback : le chip « score » pulse quand la réponse est juste. */
  if(ok){const chip=$("#tScore").closest(".chip");if(chip){chip.classList.remove("pulse");void chip.offsetWidth;chip.classList.add("pulse");}}
  $("#fb").innerHTML=`<p class="fb ${ok?"ok":"ko"}">${ok?"✓ Bien joué, +"+pts+" pts !":"✗ Raté. "+extra}</p>`+
    `<div class="explain ${ok?"good":"bad"}"><h4>Méthode</h4>${vizAns(q)}${q.explain}</div>`;
  hidePass();
  offerNext();
}

/* ---------- Passer une question ---------- */
function hidePass(){const pb=$("#passBtn");if(pb)pb.style.visibility="hidden";}
function offerNext(){
  const row=document.createElement("div");row.className="nextrow";
  const b=document.createElement("button");b.type="button";b.className="btn btn-primary";
  if(state.mode==="review"&&reviewDueCount()===0){
    b.textContent="Terminer la révision ✓";
    b.addEventListener("click",endReview);
  }else{
    b.textContent="Question suivante →";
    b.addEventListener("click",renderQ);
  }
  row.appendChild(b);qbox.appendChild(row);b.focus();
}
function countSkip(){
  state.skips++;stats.skips=(stats.skips||0)+1;
  const st=subStat(state.sub.id);st.skips=(st.skips||0)+1;
  save();
  const c=$("#tPass");if(c)c.textContent=state.skips;
}
function passQ(){
  if(state.answered)return;
  if(state.mode==="review"){reviewSkip();return;}
  if(state.mode!=="free")return;
  countSkip();
  if(state.q._passed||state.skipQueue.length>=5){revealAfterSkip();return;}
  const skipped={q:state.q,sub:state.sub};
  renderQ();
  state.skipQueue.push(skipped);
}
function revealAfterSkip(){
  state.answered=true;
  const q=state.q;
  $("#fb").innerHTML=`<p class="fb" style="color:var(--muted)">Pas de souci, on t'aide — voici la méthode pour cette question :</p>`+
    `<div class="explain"><h4>Méthode</h4>${vizAns(q)}${q.explain}</div>`;
  hidePass();
  offerNext();
}
/* Révision : « Passer » = on t'aide (méthode) + la question reste dans la liste (file en fin). */
function reviewSkip(){
  countSkip();
  reviewRequeue(state.q);
  state.answered=true;
  $("#fb").innerHTML=`<p class="fb" style="color:var(--muted)">Pas de souci — on t'aide, et la question reste dans ta liste à réviser :</p>`+
    `<div class="explain"><h4>Méthode</h4>${vizAns(state.q)}${state.q.explain}</div>`;
  hidePass();
  offerNext();
}

/* ---------- Sessions ---------- */
function startFree(){
  state.mode="free";state.score=0;state.streak=0;state.maxStreak=0;
  state.good=0;state.bad=0;state.n=0;state.skipQueue=[];state.skips=0;
  $("#tPassChip").hidden=false;$("#tPass").textContent="0";
  showPlay(true);
  $("#tScore").textContent="0";$("#tStreak").textContent="0";
  renderQ();
}
function startReview(){
  state.mode="review";state.score=0;state.streak=0;state.maxStreak=0;
  state.good=0;state.bad=0;state.n=0;state.curLvl=null;state.skipQueue=[];state.skips=0;
  $("#tPassChip").hidden=false;$("#tPass").textContent="0";
  $("#tScore").textContent="0";$("#tStreak").textContent="0";
  showPlay(true);
  renderQ();
}
function endReview(){
  state.mode="done";
  /* (2026-08-24, Cid) bonus de fin de révision — TOUJOURS crédité ;
     2026-08-26, Cid : la carte ne l'affiche plus — « simplement dire : Tout est à jour » */
  gainXp(REVIEW_BONUS);
  qbox.innerHTML=`<div class="qcard result">
    <h3>Tout est à jour</h3>
    <div class="nextrow" style="justify-content:center;margin-top:22px;gap:10px">
      <button type="button" class="btn btn-primary" id="home3">Retour à l'accueil</button>
    </div></div>`;
  if(typeof confetti==="function")confetti();
  $("#home3").addEventListener("click",goHome);
}

/* ---------- Confettis (célébration) ----------
   Pluie de papier en pur DOM : aucun fichier externe, reste hors-ligne.
   S'auto-nettoie après ~3,6 s. Désactivé si prefers-reduced-motion. */
function confetti(){
  if(typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const host=document.createElement("div");
  host.className="confetti-host";
  host.setAttribute("aria-hidden","true");
  const colors=["#2563EB","#60A5FA","#17A05E","#F59E0B","#EC4899","#8B5CF6","#22C55E"];
  for(let i=0;i<90;i++){
    const p=document.createElement("i");
    const size=(6+Math.random()*8).toFixed(1);
    p.style.left=(Math.random()*100).toFixed(2)+"%";
    p.style.width=size+"px";
    p.style.height=(size*1.5)+"px";
    p.style.background=colors[i%colors.length];
    p.style.animation="confFall "+(1.7+Math.random()*1.3).toFixed(2)+"s "+(Math.random()*0.5).toFixed(2)+"s cubic-bezier(.3,.6,.3,1) forwards";
    p.style.setProperty("--drift",((Math.random()*2-1)*180).toFixed(0)+"px");
    p.style.setProperty("--rot",Math.round(360+Math.random()*540)+"deg");
    host.appendChild(p);
  }
  document.body.appendChild(host);
  setTimeout(function(){host.remove();},3600);
}
/* ---------- Montée de niveau (2026-08-23, sur demande Cid) ----------
   Les confettis sont lancés AU PALIER FRANCHI aussi (2026-08-24, Cid — en
   plus de la carte, et toujours à la fin de la révision, endReview).
   Séquence : la carte apparaît au
   centre avec le niveau quitté, la barre se remplit (le palier franchi),
   puis le NOUVEAU niveau s'affiche grossi et la barre revient à la
   progression réelle de la matière (lvlInfo(getXP()).pct). Pur DOM, hors
   ligne, aria-hidden (décoratif), auto-nettoyage ~3,4 s. Ne plante JAMAIS
   (mêmes garanties que VIZdraw) : en environnement sans querySelector (DOM
   de test), seuls les garde-fous null bloquent le travail visuel. */
function levelUp(oldN,newN){
  if(typeof document==="undefined"||!document.body)return;
  if(typeof confetti==="function")confetti();   /* (2026-08-24, Cid) : confettis AUSSI au palier franchi (déjà désactivé sous prefers-reduced-motion) */
  const host=document.createElement("div");
  host.className="lvlup";
  host.setAttribute("aria-hidden","true");
  /* Halo + carte (anneau + grand numéro) + étincelles — le tout est décoratif. */
  host.innerHTML=
    '<div class="lvlup-glow"></div>'+
    '<div class="lvlup-card">'+
      '<span class="lvlup-kick">Niveau supérieur</span>'+
      '<div class="lvlup-numwrap">'+
        '<svg class="lvlup-ring" viewBox="0 0 124 124"><circle class="ring-bg" cx="62" cy="62" r="54"/><circle class="ring-fg" cx="62" cy="62" r="54"/></svg>'+
        '<span class="lvlup-num">'+oldN+'</span>'+
      '</div>'+
      '<span class="lvlup-nm">Niveau '+oldN+' → '+newN+'</span>'+
    '</div>'+
    '<div class="lvlup-sparks"></div>';
  document.body.appendChild(host);
  const C=2*Math.PI*54;                        /* circonférence de l'anneau (r=54) */
  const fg=host.querySelector?host.querySelector(".ring-fg"):null;
  if(fg){fg.style.strokeDasharray=C;fg.style.strokeDashoffset=C;}    /* vide ; .go le remplit */
  /* Étincelles : 14 particules accent + ambre, dispersées autour de la carte. */
  const box=host.querySelector?host.querySelector(".lvlup-sparks"):null;
  if(box){
    let h="";
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2, d=105+Math.random()*115;
      const dx=Math.round(Math.cos(a)*d), dy=Math.round(Math.sin(a)*d);
      const s=Math.round(5+Math.random()*5);
      const col=Math.random()<.6?"var(--accent)":"#FBBF24";
      h+='<i style="width:'+s+'px;height:'+s+'px;background:'+col+';--dx:'+dx+'px;--dy:'+dy+'px;animation-delay:'+Math.round(Math.random()*140)+'ms"></i>';
    }
    box.innerHTML=h;
  }
  const raf=typeof requestAnimationFrame==="function"?requestAnimationFrame:function(f){f();};
  raf(function(){raf(function(){host.classList.add("go");if(fg)fg.style.strokeDashoffset="0";});});
  /* Anneau plein → tick du niveau : le grand numéro passe de oldN à newN
     (pop + halo via .up .lvlup-num) + gerbe d'étincelles. Le swap est calé APRÈS la fin du remplissage de l'anneau (CSS .ring-fg : 0,15 + 1,4 s = 1,55 s) — durées COUPLÉES : changer l'une ⇒ changer l'autre (ralenti 2026-08-24 : le 1 s / 1150 ms était jugé trop rapide, puis resserré le même jour : 150 ms de temps mort entre la fin du remplissage et l'apparition du niveau étaient trop longues — il en reste 50). SANS ce swap, la
     carte s'achevait sur le niveau quitté (le label « N → N+1 » était le seul
     indice du nouveau — corrigé 2026-08-23, sur demande Cid). */
  setTimeout(function(){
    if(host.classList)host.classList.add("up");
    const num=host.querySelector?host.querySelector(".lvlup-num"):null;
    if(num)num.textContent=newN;
  },1600);
  setTimeout(function(){if(host.classList)host.classList.add("bye");},2900);
  setTimeout(function(){if(host.remove)host.remove();},3300);
}

/* ---------- Câblage ---------- */
/* Changement de niveau : PLUS d'animation sur les tuiles (l'ancienne .lvlswap
   est retirée) — à la place, le BOUTON cliqué réagit : press tactile CSS
   (:active) + petit rebond (.lvlpick posé ici, retiré à la fin). Le pop est
   posé AVANT le guard → il se joue même si on reclicque le niveau actif.
   Sous prefers-reduced-motion : press + pop inexistants (CSS) → seul le
   changement de couleur de sélection reste, sans mouvement. */
function setNiveau(l){
  const b=document.querySelector('.seg-btn[data-lvl="'+l+'"]');
  if(b){b.classList.add("lvlpick");setTimeout(function(){b.classList.remove("lvlpick");},340);}
  if(state.level===l)return;
  state.level=l;
  document.querySelectorAll(".seg-btn[data-lvl]").forEach(x=>x.classList.toggle("on",x.dataset.lvl===l));
  renderHome();
}
document.querySelectorAll(".seg-btn[data-lvl]").forEach(b=>b.addEventListener("click",()=>setNiveau(b.dataset.lvl)));
/* Année (spec D2) : valide la valeur, persiste la clé de la MATIÈRE ACTIVE,
   re-rend l'accueil. La réaction .yearpick est scopée à .seg-year (comme
   .lvlpick à .seg-lvl) — les boutons matière/niveau ne « pop » pas. */
function setAnnee(a){
  if(!YEARS.includes(a))return;   /* 3 ans partout — « experte » n'est plus une année (c'est une case à cocher) */
  if(a===state.annee)return;
  state.annee=a;
  state.sel=[];                       /* la sélection porte sur les ids de l'ANCIENNE année → on la vide */
  store.set(YEAR_KEY[state.matiere],a);
  document.querySelectorAll(".seg-btn[data-year]").forEach(x=>x.classList.toggle("on",x.dataset.year===a));
  renderHome();
  document.querySelectorAll(".seg-year .seg-btn").forEach(b=>{
    if(b.dataset.year===a){b.classList.remove("yearpick");void b.offsetWidth;b.classList.add("yearpick");}
  });
  setTimeout(()=>document.querySelectorAll(".seg-year .seg-btn.yearpick").forEach(b=>b.classList.remove("yearpick")),340);
}
document.querySelectorAll(".seg-btn[data-year]").forEach(b=>b.addEventListener("click",()=>{if(!b.classList.contains("on"))setAnnee(b.dataset.year);}));
/* Option « Maths expertes » : coche/décoche → pool Terminale maths 8 ↔ 11 thèmes.
   La poche (bagKey) est ré-ouverte automatiquement (clé différente) et la
   sélection de chapitres est vidée (des ids orphelins ne serviraient à rien). */
$("#xoptChk").addEventListener("change",()=>{
  state.experte=!!$("#xoptChk").checked;
  store.set("qz_experte_math",state.experte);
  state.sel=[];
  renderHome();
});
/* Ciblée sur .seg-btn : [data-mat] seul inclurait <html> (data-mat="pc" en mode
   physique-chimie) et tout clic de la page rebasculerait sur PC par délégation
   d'événement (bulles de clic). */
document.querySelectorAll(".seg-btn[data-mat]").forEach(b=>b.addEventListener("click",()=>setMatiere(b.dataset.mat)));
$("#btnFree").addEventListener("click",startFree);
$("#btnBack").addEventListener("click",goHome);
window.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(playEl.hidden||state.answered)return;
  if(state.mode!=="free"&&state.mode!=="review")return;
  e.preventDefault();passQ();
});
/* ---------- Thème : Auto / Clair / Sombre ----------
   Le CSS [data-theme] est déjà prêt (variables claires/sombres).
   Ici on branche les 3 boutons, on applique le choix, on le persiste
   (clé qz_theme, JSON) et on anime la bascule (classe .theming). */
const THEME_KEY="qz_theme";
function applyTheme(t,animate){
  const root=document.documentElement;
  if(t==="light"||t==="dark")root.setAttribute("data-theme",t);
  else root.removeAttribute("data-theme"); /* "auto" → on suit le système */
  store.set(THEME_KEY,t);
  document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("on",b.dataset.themePick===t));
  if(animate){
    root.classList.add("theming");
    clearTimeout(applyTheme._t);
    applyTheme._t=setTimeout(function(){root.classList.remove("theming");},520);
  }
}
(function initTheme(){
  let t="auto";
  const v=store.get(THEME_KEY,null);
  if(v==="light"||v==="dark"||v==="auto")t=v;
  applyTheme(t,false);
  document.querySelectorAll(".theme-btn").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.themePick,true)));
})();
/* ---------- Version d'interface : ordinateur / téléphone ----------
   Même patron que le thème : attribut data-ui sur <html> (posé AVANT le
   premier rendu par l'anti-flash → pas de flash de « mauvaise » version au
   chargement), clé qz_ui persistée, bascule IMMÉDIATE sans rechargement.
   Tout l'affichage vit dans le CSS html[data-ui="m"] (fin du <style>) ;
   ici on détecte l'appareil et on applique la version qui va avec.
   (Le basculeur manuel 🖥/📱 + la bannière ont été retirés le 2026-08-25 :
   l'app suit désormais l'appareil d'elle-même — installable / PWA.)
   Détection = HEURISTIQUE, pas de fièvre de user-agent : « téléphone » si
   pointer:coarse (le toucher est l'entrée principale) ET écran étroit
   (<900 px), OU user-agent mobile. Un vrai téléphone passe toujours l'un
   des deux ; une tablette large (≥900 px) sans UA mobile, ou un ordinateur
   tactile avec souris, restent en version ordinateur.
   Le CHOIX de l'utilisateur gagne toujours : qz_ui présente = détecté. */
const UI_KEY="qz_ui";
function detectUI(){
  try{
    const ua=typeof navigator!=="undefined"?(navigator.userAgent||""):"";
    const mobileUA=/Android|iPhone|iPod|Mobile|Opera Mini/i.test(ua);
    const coarse=typeof matchMedia==="function"&&matchMedia("(pointer:coarse)").matches;
    const small=window.innerWidth<900;
    return (coarse&&small)||mobileUA?"m":"d";
  }catch(e){return "d";}
}
function setUI(u){
  if(u!=="m"&&u!=="d")u="d";
  const r=document.documentElement;
  if(u==="m")r.setAttribute("data-ui","m");
  else r.removeAttribute("data-ui");
  store.set(UI_KEY,u);
}
(function initUI(){
  /* La version d'interface suit l'appareil (détection) — le basculeur manuel
     🖥/📱 et la bannière ont été retirés (l'app est installable et s'adapte
     d'elle-même). Le choix persisté (qz_ui) gagne toujours sur la détection. */
  const saved=store.get(UI_KEY,null);
  if(saved==="m"||saved==="d")setUI(saved);
  else setUI(detectUI());
})();
/* ---------- Topbar : ne reste pas « figée » au scroll (téléphone) ----------
   2026-08-25, Cid : le gros bloc (matières + thème) ne demeure que tant
   qu'EN HAUT de page — au scroll vers le bas il glisse hors de vue
   (classe .topbar-off, glissé par le CSS html[data-ui="m"]), et il revient
   EN COURS DE REMONTÉE, pas seulement tout en haut (2026-08-26, Cid :
   « réapparaisse plus tôt »). Seuil 60 px (l'élasticité iOS peut donner
   un scrollY négatif → reste visible, normal). Ordinateur : pas
   d'attribut data-ui → la fonction ne fait rien (topbar sticky inchangée).
   Écran de question : la topbar y est déjà display:none (règle CSS) → pas
   d'interaction. Écouteur passive : ne bloque jamais le scroll. */
(function initTopbarScroll(){
  try{
    const bar=document.querySelector(".topbar");
    if(!bar||typeof window==="undefined"||typeof window.addEventListener!=="function")return;
    const sync=()=>{
      if(!document.documentElement.hasAttribute("data-ui"))return;   /* ordinateur */
      bar.classList.toggle("topbar-off",(window.scrollY||0)>60);
    };
    window.addEventListener("scroll",sync,{passive:true});
    sync();
  }catch(e){/* harnais de test ou ancêtre navigateur : la topbar reste comme avant */}
})();
/* ---------- Révélation en cascade (haut → bas) ----------
   La chorégraphie est 100 % CSS (bloc html.boot [data-rv]) : elle se joue
   d'une traite, du premier au dernier élément, et ne peut pas se bloquer.
   Le JS la déclenche seulement ici (première visite, délais complets) et
   via setMatiere() à chaque bascule de matière (effet « switch » complet,
   délais compressés par --boot-k → pas de temps mort après le clic) — jamais au simple
   retour sur l'accueil. Les deux appels passent par rearmBoot() : UN SEUL
   cycle de vie classe+timer partagé. Retirer la classe puis la réajouter
   (reflow forcé) redémarre l'animation CSS — un simple add() serait un no-op
   si la classe est déjà là — et annule le timer de retrait précédent :
   quelle que soit la cadence des déclenchements, seule la DERNIÈRE cascade
   survit. Garde-fou symétrique : renderHome() désarme classe + timer en
   tête, donc un re-rendu fait EN PLEINE fenêtre de 2,8 s (changer de niveau
   juste après une bascule de matière) ne rejoue ni ne coupe la cascade à
   moitié. */
function rearmBoot(fast){
  const r=document.documentElement;
  clearTimeout(rearmBoot._t);    /* 1 seul timer de retrait vivant (le dernier) */
  r.classList.remove("boot");    /* réinitialise l'état d'animation */
  void r.offsetWidth;            /* reflow forcé : le ré-ajout suivant redémarre l'animation */
  /* fast (bascule de matière) : délais compressés (--boot-k=.45) → pas de
     temps mort entre le clic et le premier mouvement. Première visite : 1. */
  if(fast)r.style.setProperty("--boot-k",".45");
  else r.style.removeProperty("--boot-k");
  r.classList.add("boot");
  rearmBoot._t=setTimeout(function(){r.classList.remove("boot");},2800);
}
renderHome();
rearmBoot();   /* première visite : chorégraphie complète, délais non compressés */
</script>
<!-- PWA (2026-08-25, spec docs/2026-08-25-pwa-design.md) — enregistrement du service
     worker, EN FIN DE FICHIER (après le script de l'app) : en file:// la condition est
     fausse → rien ne s'enregistre, l'app locale reste strictement identique. En HTTPS
     (GitHub Pages) ou localhost (tests) → sw.js s'enregistre au chargement.
     .catch() : aucune erreur remontée si sw.js est absent (ex. copie locale sans sw.js). -->
<script>/* Enregistrement du service worker — HORS LIGNE + INSTALLABLE (2026-08-25).
   Gardé : ne s'active qu'en HTTPS (GitHub Pages) ou localhost. En file:// (usage
   local) la condition est fausse → il ne s'enregistre PAS, l'app locale est inchangée. */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script>
